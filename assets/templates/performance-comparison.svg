  <text x="80" y="470" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#6E6E76">Measured with BenchmarkDotNet on [machine/CLR version — EDIT]. Bar heights are illustrative in this template — scale to real numbers.</text>

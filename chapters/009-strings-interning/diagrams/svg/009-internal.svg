<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- RUNTIME/INTERNAL VIEW — chapters/009-strings-interning.
       Light isometric style, matching chapters/008-boxing-unboxing/diagrams/svg/008-deepdive.svg.
       Left: the Equals/== fast path — ReferenceEquals, then length, then ordinal bytes.
       Right, separated by a divider: the culture-aware branch routing through the
       globalization engine instead of the ordinal path. -->
  <defs>
    <filter id="ivShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dy="4" in="blur" result="off"/>
      <feComponentTransfer in="off" result="shadow"><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ivArrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#6E6E76"/>
    </marker>
    <marker id="ivArrowAmber" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#D83B01"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="80" y="52" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="700" fill="#6E6E76" letter-spacing="3">RUNTIME / INTERNAL VIEW · EPISODE 10</text>
  <text x="80" y="88" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="700" fill="#1B1B1F">Equals / == — the reference-equality fast path, before a single byte is compared</text>

  <!-- Start pill -->
  <rect x="220" y="130" width="300" height="50" rx="25" fill="#F3F0FC" stroke="#512BD4" stroke-width="1.5"/>
  <text x="370" y="161" font-family="Cascadia Code, Fira Code, monospace" font-size="14.5" fill="#2E1065" text-anchor="middle">a.Equals(b)  /  a == b</text>

  <line x1="370" y1="180" x2="370" y2="222" stroke="#6E6E76" stroke-width="2" marker-end="url(#ivArrow)"/>

  <!-- Decision 1: ReferenceEquals -->
  <polygon points="370,224 490,290 370,356 250,290" fill="#EFF6FF" stroke="#2D75C4" stroke-width="1.5" filter="url(#ivShadow)"/>
  <text x="370" y="284" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#0B3A66" text-anchor="middle">ReferenceEquals</text>
  <text x="370" y="302" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#0B3A66" text-anchor="middle">(a, b)?</text>

  <!-- Yes -> fast true -->
  <line x1="490" y1="290" x2="600" y2="290" stroke="#107C10" stroke-width="2.5" marker-end="url(#ivArrow)"/>
  <text x="530" y="278" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="700" fill="#107C10">yes</text>
  <rect x="610" y="252" width="360" height="76" rx="10" fill="#F0FDF4" stroke="#107C10" stroke-width="1.5" filter="url(#ivShadow)"/>
  <text x="790" y="284" font-family="Segoe UI, Inter, sans-serif" font-size="14.5" font-weight="700" fill="#0F5D0F" text-anchor="middle">return true</text>
  <text x="790" y="304" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" fill="#0F5D0F" text-anchor="middle">no characters compared at all</text>

  <rect x="1000" y="256" width="300" height="40" rx="20" fill="#FFFFFF" stroke="#107C10" stroke-width="1.5"/>
  <text x="1150" y="281" font-family="Cascadia Code, Fira Code, monospace" font-size="13" fill="#0F5D0F" text-anchor="middle">measured 51.7× faster (Perf. Notes #2)</text>

  <!-- No -> length check -->
  <line x1="370" y1="356" x2="370" y2="400" stroke="#6E6E76" stroke-width="2" marker-end="url(#ivArrow)"/>
  <text x="386" y="384" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="700" fill="#6E6E76">no</text>

  <polygon points="370,402 490,462 370,522 250,462" fill="#EFF6FF" stroke="#2D75C4" stroke-width="1.5" filter="url(#ivShadow)"/>
  <text x="370" y="456" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#0B3A66" text-anchor="middle">a.Length ==</text>
  <text x="370" y="474" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#0B3A66" text-anchor="middle">b.Length?</text>

  <!-- No -> false -->
  <line x1="490" y1="462" x2="600" y2="462" stroke="#D83B01" stroke-width="2.5" marker-end="url(#ivArrowAmber)"/>
  <text x="530" y="450" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="700" fill="#D83B01">no</text>
  <rect x="610" y="424" width="360" height="76" rx="10" fill="#FFF7ED" stroke="#D83B01" stroke-width="1.5" filter="url(#ivShadow)"/>
  <text x="790" y="456" font-family="Segoe UI, Inter, sans-serif" font-size="14.5" font-weight="700" fill="#9A3412" text-anchor="middle">return false</text>
  <text x="790" y="476" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" fill="#9A3412" text-anchor="middle">immediately — lengths differ</text>

  <!-- Yes -> ordinal comparison -->
  <line x1="370" y1="522" x2="370" y2="566" stroke="#6E6E76" stroke-width="2" marker-end="url(#ivArrow)"/>
  <text x="386" y="550" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="700" fill="#6E6E76">yes</text>

  <rect x="190" y="568" width="360" height="76" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5" filter="url(#ivShadow)"/>
  <text x="370" y="600" font-family="Segoe UI, Inter, sans-serif" font-size="14.5" font-weight="700" fill="#2E1065" text-anchor="middle">Ordinal byte-by-byte comparison</text>
  <text x="370" y="620" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" fill="#2E1065" text-anchor="middle">walks the actual character buffers</text>

  <line x1="370" y1="644" x2="370" y2="684" stroke="#6E6E76" stroke-width="2" marker-end="url(#ivArrow)"/>
  <rect x="190" y="686" width="360" height="56" rx="10" fill="#F8FAFC" stroke="#D8D8DE" stroke-width="1.5"/>
  <text x="370" y="720" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="600" fill="#1B1B1F" text-anchor="middle">return the result</text>

  <!-- Divider -->
  <line x1="1150" y1="130" x2="1150" y2="780" stroke="#D8D8DE" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Culture-aware branch -->
  <text x="1200" y="152" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#D83B01" letter-spacing="1.5">CULTURE-AWARE COMPARISON — A SEPARATE PATH</text>

  <rect x="1200" y="180" width="340" height="90" rx="10" fill="#FFF7ED" stroke="#D83B01" stroke-width="1.5" filter="url(#ivShadow)"/>
  <text x="1370" y="212" font-family="Cascadia Code, Fira Code, monospace" font-size="13" fill="#9A3412" text-anchor="middle">StringComparison.CurrentCulture /</text>
  <text x="1370" y="232" font-family="Cascadia Code, Fira Code, monospace" font-size="13" fill="#9A3412" text-anchor="middle">InvariantCulture requested?</text>
  <text x="1370" y="255" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#9A3412" text-anchor="middle">(instead of the ordinal path at left)</text>

  <line x1="1370" y1="270" x2="1370" y2="330" stroke="#D83B01" stroke-width="2.5" stroke-dasharray="2 6" marker-end="url(#ivArrowAmber)"/>

  <rect x="1200" y="332" width="340" height="110" rx="10" fill="#FFF7ED" stroke="#D83B01" stroke-width="1.5" filter="url(#ivShadow)"/>
  <text x="1370" y="366" font-family="Segoe UI, Inter, sans-serif" font-size="14.5" font-weight="700" fill="#9A3412" text-anchor="middle">Routes through the</text>
  <text x="1370" y="388" font-family="Segoe UI, Inter, sans-serif" font-size="14.5" font-weight="700" fill="#9A3412" text-anchor="middle">globalization engine</text>
  <text x="1370" y="412" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" fill="#9A3412" text-anchor="middle">linguistic case-folding &amp; collation rules —</text>
  <text x="1370" y="430" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" fill="#9A3412" text-anchor="middle">not a raw byte comparison</text>

  <rect x="1200" y="470" width="340" height="46" rx="23" fill="#FFFFFF" stroke="#D83B01" stroke-width="1.5"/>
  <text x="1370" y="498" font-family="Cascadia Code, Fira Code, monospace" font-size="13" fill="#9A3412" text-anchor="middle">~25.7× slower + Turkish-I risk</text>

  <text x="1200" y="600" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#6E6E76" width="340">Ordinal never touches the</text>
  <text x="1200" y="622" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#6E6E76">globalization engine — CurrentCulture</text>
  <text x="1200" y="644" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#6E6E76">always does, regardless of reference</text>
  <text x="1200" y="666" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#6E6E76">identity or length.</text>

  <text x="80" y="850" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" fill="#6E6E76">Equals/== always try ReferenceEquals → Length → Ordinal bytes first — CurrentCulture/InvariantCulture opt out of that entire fast path.</text>
</svg>

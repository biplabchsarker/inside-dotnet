<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- PERFORMANCE & QUICK REFERENCE — chapters/009-strings-interning.
       Light isometric / cheat-sheet style, matching
       chapters/008-boxing-unboxing/diagrams/svg/008-cheatsheet.svg, widened to the
       shared 1600x900 template. Every number below is copied verbatim from
       article.md's Performance Notes section (BenchmarkDotNet, .NET 10.0.8). Bar
       lengths use a sqrt scale so 20-50x ratios fit on one canvas — exact multipliers
       are always printed as text alongside the bar. -->
  <defs>
    <linearGradient id="perfHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#512BD4"/>
      <stop offset="100%" stop-color="#0078D4"/>
    </linearGradient>
    <marker id="perfArrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <rect width="1600" height="100" fill="url(#perfHeader)"/>
  <text x="80" y="42" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" opacity="0.85" letter-spacing="2">INSIDE .NET — CHEAT SHEET · EPISODE 10</text>
  <text x="80" y="76" font-family="Segoe UI, Inter, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">Strings &amp; Interning</text>

  <!-- LEFT COLUMN -->
  <rect x="80" y="140" width="700" height="92" rx="10" fill="#512BD4" opacity="0.07" stroke="#512BD4" stroke-width="2"/>
  <text x="102" y="168" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#512BD4" letter-spacing="2">THE ONE-LINE RULE</text>
  <text x="102" y="196" font-family="Segoe UI, Inter, sans-serif" font-size="15.5" font-weight="600" fill="#1B1B1F">Default to Ordinal comparisons and a small, bounded intern vocabulary —</text>
  <text x="102" y="218" font-family="Segoe UI, Inter, sans-serif" font-size="15.5" font-weight="600" fill="#1B1B1F">culture-aware comparison and unbounded interning both carry a real cost.</text>

  <text x="80" y="270" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="700" fill="#1B1B1F" letter-spacing="1">REMEMBER THIS</text>
  <g font-family="Segoe UI, Inter, sans-serif" font-size="14.5" fill="#1B1B1F">
    <circle cx="92" cy="300" r="4.5" fill="#0078D4"/>
    <text x="108" y="305">Literals intern automatically via ldstr; runtime-built strings never do</text>
    <circle cx="92" cy="330" r="4.5" fill="#0078D4"/>
    <text x="108" y="335">Equals/== check ReferenceEquals before comparing a single character</text>
    <circle cx="92" cy="360" r="4.5" fill="#0078D4"/>
    <text x="108" y="365">s.Substring(0, s.Length) returns s itself — zero allocation, same ref</text>
    <circle cx="92" cy="390" r="4.5" fill="#0078D4"/>
    <text x="108" y="395">Anything interned is rooted for the process's life — never reclaimed</text>
  </g>

  <rect x="80" y="440" width="700" height="200" rx="10" fill="#68217A" opacity="0.06" stroke="#68217A" stroke-width="2"/>
  <text x="102" y="472" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#68217A" letter-spacing="2">IF THEY ASK ONE THING</text>
  <text x="102" y="504" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="700" fill="#1B1B1F">"What does 'I'.ToLower() produce under tr-TR,</text>
  <text x="102" y="528" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="700" fill="#1B1B1F">and why does it matter?"</text>
  <text x="102" y="562" font-family="Segoe UI, Inter, sans-serif" font-size="14.5" fill="#1B1B1F">It produces "ı" (dotless i), not the ASCII "i" an ordinal</text>
  <text x="102" y="586" font-family="Segoe UI, Inter, sans-serif" font-size="14.5" fill="#1B1B1F">comparison expects — a case-insensitive check correct</text>
  <text x="102" y="610" font-family="Segoe UI, Inter, sans-serif" font-size="14.5" fill="#1B1B1F">under one culture can silently fail under another.</text>

  <!-- Divider -->
  <line x1="820" y1="140" x2="820" y2="820" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- RIGHT COLUMN — measured bars -->
  <text x="860" y="168" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="700" fill="#1B1B1F" letter-spacing="1">MEASURED — BenchmarkDotNet, not estimates</text>

  <g font-family="Segoe UI, Inter, sans-serif" font-size="13.5">
    <!-- Metric 1: Ordinal vs CurrentCultureIgnoreCase -->
    <text x="860" y="204" fill="#1B1B1F" font-weight="600">Ordinal vs. CurrentCultureIgnoreCase (100K checks)</text>
    <text x="860" y="228" fill="#1B1B1F">OrdinalIgnoreCase</text>
    <rect x="1080" y="216" width="50" height="17" rx="4" fill="#107C10"/>
    <text x="1140" y="228" fill="#6E6E76">1.00× baseline</text>
    <text x="860" y="260" fill="#1B1B1F">CurrentCultureIgnoreCase</text>
    <rect x="1080" y="248" width="304" height="17" rx="4" fill="#D83B01"/>
    <text x="1394" y="260" fill="#6E6E76" font-weight="700">25.66×</text>

    <!-- Metric 2: Equals same-ref vs different-ref -->
    <text x="860" y="304" fill="#1B1B1F" font-weight="600">Equals: same reference vs. different (1M calls, 500 chars)</text>
    <text x="860" y="328" fill="#1B1B1F">Same reference</text>
    <rect x="1080" y="316" width="50" height="17" rx="4" fill="#107C10"/>
    <text x="1140" y="328" fill="#6E6E76">1.00× baseline</text>
    <text x="860" y="360" fill="#1B1B1F">Different reference, equal content</text>
    <rect x="1080" y="348" width="432" height="17" rx="4" fill="#D83B01"/>
    <text x="1522" y="360" fill="#6E6E76" font-weight="700">51.74×</text>

    <!-- Metric 3: Substring whole-range vs partial -->
    <text x="860" y="404" fill="#1B1B1F" font-weight="600">Substring: whole-range vs. partial (100K calls, 64 chars)</text>
    <text x="860" y="428" fill="#1B1B1F">Whole range (0, s.Length)</text>
    <rect x="1080" y="416" width="50" height="17" rx="4" fill="#107C10"/>
    <text x="1140" y="428" fill="#6E6E76">1.00× · 0 B</text>
    <text x="860" y="460" fill="#1B1B1F">Partial range</text>
    <rect x="1080" y="448" width="292" height="17" rx="4" fill="#D83B01"/>
    <text x="1382" y="460" fill="#6E6E76" font-weight="700">23.62× · 152 B/call</text>
  </g>
  <text x="860" y="492" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#9CA3AF">Bar length ∝ √ratio for readability — exact multipliers always printed as text.</text>

  <!-- Memory retention stat card -->
  <rect x="860" y="530" width="660" height="150" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="884" y="558" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#512BD4" letter-spacing="1.5">INTERN-POOL MEMORY RETENTION — 200,000 UNIQUE STRINGS</text>

  <text x="920" y="616" font-family="Cascadia Code, Fira Code, monospace" font-size="24" font-weight="700" fill="#0F5D0F" text-anchor="middle">57 KB</text>
  <text x="920" y="638" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#6E6E76" text-anchor="middle">baseline (57,120 B)</text>

  <path d="M 1030,610 L 1120,610" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#perfArrow)"/>

  <text x="1330" y="616" font-family="Cascadia Code, Fira Code, monospace" font-size="24" font-weight="700" fill="#9A3412" text-anchor="middle">16.2 MB</text>
  <text x="1330" y="638" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#6E6E76" text-anchor="middle">retained (16,157,680 B) — not reclaimed</text>

  <text x="1170" y="666" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#6E6E76" text-anchor="middle">after string.Intern(s) × 200,000, then a forced GC.Collect()</text>

  <text x="80" y="862" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#6E6E76">Inside .NET — Understanding What Really Happens Under the Hood — inside-dotnet</text>
</svg>

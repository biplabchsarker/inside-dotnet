<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- CONCEPT ILLUSTRATION — chapters/009-strings-interning.
       Light isometric style, matching chapters/008-boxing-unboxing/diagrams/svg/008-concept.svg.
       Row 1: literals flow into the shared Intern Pool. Row 2: runtime-built strings
       (concatenation, StringBuilder, Substring) flow PAST the pool into ordinary heap
       objects, with a dotted "only if you call string.Intern" arrow back to the pool. -->
  <defs>
    <filter id="softShadow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dy="4" in="blur" result="off"/>
      <feComponentTransfer in="off" result="shadow"><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="conceptArrowP" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#512BD4"/>
    </marker>
    <marker id="conceptArrowS" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#475569"/>
    </marker>
    <marker id="conceptArrowDash" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#8B5CF6"/>
    </marker>
    <radialGradient id="poolGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#512BD4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#512BD4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="80" y="52" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="700" fill="#6E6E76" letter-spacing="3">CONCEPT OVERVIEW · EPISODE 10</text>
  <text x="80" y="88" font-family="Segoe UI, Inter, sans-serif" font-size="26" font-weight="700" fill="#1B1B1F">What gets interned automatically — and what doesn't</text>

  <circle cx="760" cy="330" r="180" fill="url(#poolGlow)"/>

  <!-- ROW 1: literals -->
  <text x="80" y="152" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#512BD4" letter-spacing="2">LITERALS — INTERNED AUTOMATICALLY</text>

  <g font-family="Segoe UI, Inter, sans-serif" font-size="14.5" fill="#1B1B1F">
    <rect x="80" y="180" width="280" height="52" rx="10" fill="#F3F0FC" stroke="#512BD4" stroke-width="1.5"/>
    <text x="106" y="212">A string literal ("...")</text>

    <rect x="80" y="248" width="280" height="52" rx="10" fill="#F3F0FC" stroke="#512BD4" stroke-width="1.5"/>
    <text x="106" y="272">A const expression the compiler</text>
    <text x="106" y="290" font-size="12.5" fill="#6E6E76">folds to one literal at compile time</text>
  </g>

  <path d="M 360,206 C 480,206 520,220 590,270" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#conceptArrowP)"/>
  <path d="M 360,274 C 480,274 520,260 590,290" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#conceptArrowP)"/>

  <!-- Intern Pool icon (cylinder / vault) -->
  <g filter="url(#softShadow2)">
    <path d="M 640,260 A 120,26 0 0 1 880,260 L 880,360 A 120,26 0 0 1 640,360 Z" fill="#DDD6FE" stroke="#512BD4" stroke-width="1.5"/>
    <ellipse cx="760" cy="260" rx="120" ry="26" fill="#EDE9FE" stroke="#512BD4" stroke-width="1.5"/>
    <ellipse cx="760" cy="260" rx="120" ry="26" fill="none" stroke="#512BD4" stroke-width="1" stroke-opacity="0.4"/>
  </g>
  <text x="760" y="315" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700" fill="#2E1065" text-anchor="middle">Intern Pool</text>
  <text x="760" y="400" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#6E6E76" text-anchor="middle">process-wide, keyed by content</text>

  <path d="M 880,280 C 950,270 1000,255 1060,240" fill="none" stroke="#512BD4" stroke-width="2.5" marker-end="url(#conceptArrowP)"/>

  <g filter="url(#softShadow2)">
    <polygon points="1160,180 1210,207 1160,234 1110,207" fill="#DDD6FE"/>
    <polygon points="1110,207 1160,234 1160,280 1110,253" fill="#8B5CF6"/>
    <polygon points="1160,234 1210,207 1210,253 1160,280" fill="#512BD4"/>
  </g>
  <text x="1160" y="315" font-family="Segoe UI, Inter, sans-serif" font-size="14.5" font-weight="600" fill="#1B1B1F" text-anchor="middle">One shared instance</text>
  <text x="1160" y="335" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" fill="#6E6E76" text-anchor="middle">every matching literal, everywhere</text>

  <line x1="60" y1="430" x2="1540" y2="430" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- ROW 2: runtime-built -->
  <text x="80" y="490" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#475569" letter-spacing="2">RUNTIME-BUILT — NEVER AUTOMATIC</text>

  <g font-family="Segoe UI, Inter, sans-serif" font-size="14" fill="#1B1B1F">
    <rect x="80" y="518" width="280" height="46" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
    <text x="106" y="546">Concatenation ('+' on variables)</text>

    <rect x="80" y="574" width="280" height="46" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
    <text x="106" y="602">StringBuilder.ToString()</text>

    <rect x="80" y="630" width="280" height="46" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
    <text x="106" y="658">Substring (partial range)</text>
  </g>

  <!-- Arrows flow past the pool's x-position, well below it, into the heap cluster -->
  <path d="M 360,541 C 700,600 850,600 1000,600" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#conceptArrowS)"/>
  <path d="M 360,597 C 650,610 850,605 1000,605" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#conceptArrowS)"/>
  <path d="M 360,653 C 650,625 850,610 1000,610" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#conceptArrowS)"/>
  <text x="760" y="580" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#9CA3AF" font-style="italic">(flows straight past the pool — no lookup happens)</text>

  <!-- Ordinary heap objects (slate cluster) -->
  <g filter="url(#softShadow2)">
    <polygon points="1080,545 1122,568 1080,591 1038,568" fill="#E2E8F0"/>
    <polygon points="1038,568 1080,591 1080,632 1038,609" fill="#94A3B8"/>
    <polygon points="1080,591 1122,568 1122,609 1080,632" fill="#475569"/>
  </g>
  <g filter="url(#softShadow2)">
    <polygon points="1170,570 1212,593 1170,616 1128,593" fill="#E2E8F0"/>
    <polygon points="1128,593 1170,616 1170,657 1128,634" fill="#94A3B8"/>
    <polygon points="1170,616 1212,593 1212,634 1170,657" fill="#475569"/>
  </g>
  <g filter="url(#softShadow2)">
    <polygon points="1260,545 1302,568 1260,591 1218,568" fill="#E2E8F0"/>
    <polygon points="1218,568 1260,591 1260,632 1218,609" fill="#94A3B8"/>
    <polygon points="1260,591 1302,568 1302,609 1260,632" fill="#475569"/>
  </g>
  <text x="1170" y="695" font-family="Segoe UI, Inter, sans-serif" font-size="14.5" font-weight="600" fill="#1B1B1F" text-anchor="middle">Ordinary heap objects</text>
  <text x="1170" y="715" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" fill="#6E6E76" text-anchor="middle">GC-collectible normally</text>

  <!-- Dotted return arrow back to the pool -->
  <path d="M 1100,545 C 1000,440 900,360 885,320" fill="none" stroke="#8B5CF6" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round" marker-end="url(#conceptArrowDash)"/>
  <rect x="900" y="440" width="290" height="42" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="1045" y="466" font-family="Cascadia Code, Fira Code, monospace" font-size="12.5" fill="#512BD4" text-anchor="middle">only if you call string.Intern(s)</text>

  <text x="80" y="850" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" fill="#6E6E76">The pool only grows automatically for literals — runtime-built content is left alone unless you explicitly ask for it.</text>
</svg>

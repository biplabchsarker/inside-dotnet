<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- HERO ILLUSTRATION — chapters/008-boxing-unboxing. Duplicated from assets/brand hero template.
       Core motif: a value type mid-transit into a heap-allocated box. Inputs on the left are the
       trigger sites that force a box; outputs on the right are what a box guarantees and what it
       costs to reverse. Ring label ties back to Episode 8's allocator. -->
  <defs>
    <linearGradient id="heroField" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1240"/>
      <stop offset="55%" stop-color="#2A1B6E"/>
      <stop offset="100%" stop-color="#0B3A66"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8F7BFF" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#512BD4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#512BD4" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.05"/>
    </pattern>
    <marker id="heroArrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#FFFFFF" opacity="0.7"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#heroField)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Core glow field -->
  <circle cx="800" cy="430" r="260" fill="url(#coreGlow)"/>

  <!-- Containing-system ring: the managed heap, allocated through Episode 8's mechanism -->
  <g opacity="0.5">
    <circle cx="800" cy="430" r="230" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 10"/>
    <text x="800" y="188" font-family="Segoe UI, Inter, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">MANAGED HEAP</text>
  </g>

  <!-- CORE motif: a value mid-transit into a freshly allocated box -->
  <rect x="742" y="372" width="116" height="116" rx="10" fill="#FFFFFF" opacity="0.12" filter="url(#softGlow)"/>
  <rect x="742" y="372" width="116" height="116" rx="10" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="800" y="415" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">BOX</text>
  <text x="800" y="437" font-family="Cascadia Code, Fira Code, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" opacity="0.85">header +</text>
  <text x="800" y="454" font-family="Cascadia Code, Fira Code, monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" opacity="0.85">value copy</text>

  <!-- INPUT elements flowing in from the left: what forces a box -->
  <g>
    <rect x="180" y="290" width="160" height="48" rx="8" fill="#FFFFFF" opacity="0.10" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="260" y="319" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">int / struct value</text>
    <path d="M340 314 L738 400" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5" marker-end="url(#heroArrow)"/>

    <rect x="180" y="360" width="160" height="48" rx="8" fill="#FFFFFF" opacity="0.10" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="260" y="389" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">ArrayList.Add(x)</text>
    <path d="M340 384 L742 418" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5" marker-end="url(#heroArrow)"/>

    <rect x="180" y="470" width="160" height="48" rx="8" fill="#FFFFFF" opacity="0.10" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="260" y="499" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">IThing t = value;</text>
    <path d="M340 494 L742 460" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5" marker-end="url(#heroArrow)"/>
  </g>

  <!-- OUTPUT elements flowing out to the right: what the box guarantees and costs -->
  <g>
    <rect x="1250" y="300" width="170" height="48" rx="8" fill="#FFFFFF" opacity="0.10" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="1335" y="329" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Real heap object</text>
    <path d="M862 400 L1248 324" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5" marker-end="url(#heroArrow)"/>

    <rect x="1250" y="410" width="170" height="48" rx="8" fill="#FFFFFF" opacity="0.10" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="1335" y="439" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Exact-type unbox only</text>
    <path d="M858 432 L1248 434" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5" marker-end="url(#heroArrow)"/>

    <rect x="1250" y="520" width="170" height="48" rx="8" fill="#FFFFFF" opacity="0.10" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="1335" y="549" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">New identity, no reuse</text>
    <path d="M855 460 L1248 544" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5" marker-end="url(#heroArrow)"/>
  </g>

  <!-- Title block, bottom-left -->
  <text x="120" y="760" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" opacity="0.75" letter-spacing="3">PART II — MEMORY</text>
  <text x="120" y="812" font-family="Segoe UI, Inter, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF">Boxing &amp; Unboxing</text>
</svg>

<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- HERO ILLUSTRATION v2 — chapters/008-boxing-unboxing.
       Light "book-quality" isometric style, prototyped per 2026-08 review feedback:
       stack cube (blue, int value) <-> heap cube (purple, boxed object), glowing
       Boxing/Unboxing arcs between them, minimal callouts, a 3-line code snippet,
       and a footer tagline. No blueprint grid, no dense text — one concept, lots
       of whitespace. This departs from the dark-blueprint hero convention used in
       Chapters 000-007; keep only if the project adopts this as the new standard. -->
  <defs>
    <linearGradient id="bgWash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F3F0FC"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0078D4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0078D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#512BD4" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#512BD4" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feOffset dy="8" in="blur" result="offsetBlur"/>
      <feComponentTransfer in="offsetBlur" result="shadow">
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="arrowGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="arrowStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#512BD4"/>
    </linearGradient>
    <marker id="heroArrowLight" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#512BD4"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bgWash)"/>
  <circle cx="430" cy="460" r="260" fill="url(#blueGlow)"/>
  <circle cx="1170" cy="460" r="300" fill="url(#purpleGlow)"/>

  <!-- Small series label, top-left — kept minimal so the cubes stay the focus -->
  <text x="100" y="90" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="600" fill="#6E6E76" letter-spacing="3">PART II — MEMORY · EPISODE 9</text>
  <text x="100" y="130" font-family="Segoe UI, Inter, sans-serif" font-size="34" font-weight="700" fill="#1B1B1F">Boxing &amp; Unboxing</text>

  <!-- STACK CUBE (blue) — a value type, int number = 42 -->
  <g filter="url(#softShadow)">
    <polygon points="430,355 520,400 430,445 340,400" fill="#BFDBFE"/>
    <polygon points="340,400 430,445 430,565 340,520" fill="#60A5FA"/>
    <polygon points="430,445 520,400 520,520 430,565" fill="#2D75C4"/>
    <polygon points="430,355 520,400 430,445 340,400" fill="none" stroke="#0B4A8C" stroke-width="1.5" stroke-opacity="0.25"/>
  </g>
  <text x="430" y="392" font-family="Cascadia Code, Fira Code, monospace" font-size="20" font-weight="700" fill="#0B3A66" text-anchor="middle">42</text>
  <text x="430" y="628" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="600" fill="#0B3A66" text-anchor="middle">Stack</text>
  <text x="430" y="650" font-family="Cascadia Code, Fira Code, monospace" font-size="13" fill="#6E6E76" text-anchor="middle">int number = 42;</text>

  <!-- HEAP CUBE (purple) — the boxed object: header + copied value -->
  <g filter="url(#softShadow)">
    <polygon points="1170,345 1280,400 1170,455 1060,400" fill="#DDD6FE"/>
    <polygon points="1060,400 1170,455 1170,605 1060,550" fill="#8B5CF6"/>
    <polygon points="1170,455 1280,400 1280,550 1170,605" fill="#512BD4"/>
    <polygon points="1170,345 1280,400 1170,455 1060,400" fill="none" stroke="#2E1065" stroke-width="1.5" stroke-opacity="0.25"/>
    <!-- header stripe on the top face, echoing the object header from Episode 8 -->
    <rect x="1130" y="392" width="80" height="10" rx="3" fill="#2E1065" opacity="0.35"/>
  </g>
  <text x="1170" y="382" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700" fill="#2E1065" text-anchor="middle" opacity="0.7">HEADER</text>
  <text x="1170" y="646" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="600" fill="#2E1065" text-anchor="middle">Heap</text>
  <text x="1170" y="668" font-family="Cascadia Code, Fira Code, monospace" font-size="13" fill="#6E6E76" text-anchor="middle">object boxed = number;</text>

  <!-- BOXING arc: stack -> heap -->
  <path d="M 545,368 C 700,255 900,255 1045,368" fill="none" stroke="url(#arrowStroke)" stroke-width="4" stroke-linecap="round" filter="url(#arrowGlow)" marker-end="url(#heroArrowLight)"/>
  <text x="795" y="255" font-family="Segoe UI, Inter, sans-serif" font-size="18" font-weight="700" fill="#512BD4" text-anchor="middle">Boxing</text>

  <!-- UNBOXING arc: heap -> stack -->
  <path d="M 1045,540 C 900,650 700,650 545,540" fill="none" stroke="url(#arrowStroke)" stroke-width="4" stroke-linecap="round" filter="url(#arrowGlow)" marker-end="url(#heroArrowLight)"/>
  <text x="795" y="695" font-family="Segoe UI, Inter, sans-serif" font-size="18" font-weight="700" fill="#0078D4" text-anchor="middle">Unboxing</text>

  <!-- Callout chips -->
  <g font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="600">
    <rect x="60" y="740" width="190" height="44" rx="22" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="86" cy="762" r="5" fill="#D83B01"/>
    <text x="102" y="767" fill="#1B1B1F">Performance Cost</text>

    <rect x="270" y="740" width="200" height="44" rx="22" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="296" cy="762" r="5" fill="#D83B01"/>
    <text x="312" y="767" fill="#1B1B1F">Hidden Allocation</text>

    <rect x="490" y="740" width="170" height="44" rx="22" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="516" cy="762" r="5" fill="#107C10"/>
    <text x="532" y="767" fill="#1B1B1F">Type Safety</text>
  </g>

  <!-- Minimal code snippet card -->
  <g filter="url(#softShadow)">
    <rect x="900" y="720" width="440" height="130" rx="14" fill="#1B1240"/>
  </g>
  <text x="928" y="756" font-family="Cascadia Code, Fira Code, monospace" font-size="15" fill="#8F7BFF">int</text>
  <text x="960" y="756" font-family="Cascadia Code, Fira Code, monospace" font-size="15" fill="#E5E7EB"> number = 42;</text>
  <text x="928" y="782" font-family="Cascadia Code, Fira Code, monospace" font-size="15" fill="#60A5FA">object</text>
  <text x="1015" y="782" font-family="Cascadia Code, Fira Code, monospace" font-size="15" fill="#E5E7EB"> boxed = number;</text>
  <text x="928" y="808" font-family="Cascadia Code, Fira Code, monospace" font-size="15" fill="#8F7BFF">int</text>
  <text x="960" y="808" font-family="Cascadia Code, Fira Code, monospace" font-size="15" fill="#E5E7EB"> unboxed = (int)boxed;</text>

  <!-- Footer tagline -->
  <text x="800" y="875" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-style="italic" fill="#6E6E76" text-anchor="middle">Converting Value Types into Objects — and Back Again</text>
</svg>

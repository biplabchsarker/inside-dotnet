<svg viewBox="0 0 1400 700" xmlns="http://www.w3.org/2000/svg">
  <!-- CONCEPT ILLUSTRATION v2 — chapters/008-boxing-unboxing.
       Light isometric style, matching the new 008-hero.svg language.
       Row 1: the Boxing flow. Row 2: the Unboxing flow. One idea per row,
       minimal text, small isometric cube glyphs instead of dense diagram nodes. -->
  <defs>
    <filter id="softShadow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dy="4" in="blur" result="off"/>
      <feComponentTransfer in="off" result="shadow"><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="conceptArrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#6E6E76"/>
    </marker>
  </defs>

  <rect width="1400" height="700" fill="#FFFFFF"/>
  <text x="60" y="60" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="700" fill="#1B1B1F">Boxing and unboxing — one concept per row</text>

  <!-- ROW 1: Boxing flow -->
  <text x="60" y="150" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#6E6E76" letter-spacing="2">BOXING FLOW</text>

  <g filter="url(#softShadow2)">
    <polygon points="220,175 260,195 220,215 180,195" fill="#BFDBFE"/>
    <polygon points="180,195 220,215 220,255 180,235" fill="#60A5FA"/>
    <polygon points="220,215 260,195 260,235 220,255" fill="#2D75C4"/>
  </g>
  <text x="220" y="290" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="600" fill="#1B1B1F" text-anchor="middle">Value Type</text>
  <text x="220" y="310" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#6E6E76" text-anchor="middle">(Stack)</text>

  <line x1="290" y1="205" x2="530" y2="205" stroke="#6E6E76" stroke-width="2" marker-end="url(#conceptArrow)"/>
  <rect x="345" y="178" width="110" height="34" rx="17" fill="#F3F0FC" stroke="#512BD4" stroke-width="1.5"/>
  <text x="400" y="200" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#512BD4" text-anchor="middle">Boxing</text>

  <g filter="url(#softShadow2)">
    <polygon points="620,170 670,197 620,224 570,197" fill="#DDD6FE"/>
    <polygon points="570,197 620,224 620,270 570,243" fill="#8B5CF6"/>
    <polygon points="620,224 670,197 670,243 620,270" fill="#512BD4"/>
  </g>
  <text x="620" y="290" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="600" fill="#1B1B1F" text-anchor="middle">Reference Object</text>
  <text x="620" y="310" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#6E6E76" text-anchor="middle">(Heap)</text>

  <text x="900" y="200" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#6E6E76">Allocates through the same fast path as Episode 8 —</text>
  <text x="900" y="220" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#6E6E76">header write, then a full copy of the value's bits.</text>

  <line x1="60" y1="380" x2="1340" y2="380" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- ROW 2: Unboxing flow -->
  <text x="60" y="450" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#6E6E76" letter-spacing="2">UNBOXING FLOW</text>

  <g filter="url(#softShadow2)">
    <polygon points="220,475 260,495 220,515 180,495" fill="#DDD6FE"/>
    <polygon points="180,495 220,515 220,555 180,535" fill="#8B5CF6"/>
    <polygon points="220,515 260,495 260,535 220,555" fill="#512BD4"/>
  </g>
  <text x="220" y="590" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="600" fill="#1B1B1F" text-anchor="middle">Heap Object</text>

  <line x1="290" y1="505" x2="420" y2="505" stroke="#6E6E76" stroke-width="2" marker-end="url(#conceptArrow)"/>
  <rect x="430" y="478" width="140" height="54" rx="10" fill="#FFF7ED" stroke="#D83B01" stroke-width="1.5"/>
  <text x="500" y="500" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#D83B01" text-anchor="middle">Type Check</text>
  <text x="500" y="518" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#9A5B1F" text-anchor="middle">exact match only</text>

  <line x1="580" y1="505" x2="710" y2="505" stroke="#6E6E76" stroke-width="2" marker-end="url(#conceptArrow)"/>
  <rect x="720" y="478" width="140" height="54" rx="10" fill="#F0FDF4" stroke="#107C10" stroke-width="1.5"/>
  <text x="790" y="500" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#107C10" text-anchor="middle">Copy Value</text>
  <text x="790" y="518" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#0F5D0F" text-anchor="middle">out of the box</text>

  <line x1="870" y1="505" x2="1000" y2="505" stroke="#6E6E76" stroke-width="2" marker-end="url(#conceptArrow)"/>

  <g filter="url(#softShadow2)">
    <polygon points="1090,475 1130,495 1090,515 1050,495" fill="#BFDBFE"/>
    <polygon points="1050,495 1090,515 1090,555 1050,535" fill="#60A5FA"/>
    <polygon points="1090,515 1130,495 1130,535 1090,555" fill="#2D75C4"/>
  </g>
  <text x="1090" y="590" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="600" fill="#1B1B1F" text-anchor="middle">Stack Variable</text>

  <text x="60" y="650" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#6E6E76">A mismatch at "Type Check" throws InvalidCastException immediately — there is no fallback conversion step.</text>
</svg>

<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- RUNTIME / INTERNAL VIEW — chapters/016-generics.
       Precision runtime layout matching 008-deepdive.svg.
       Panel 1: Value Type Specialization (Unique native machine code per struct).
       Panel 2: Reference Type Code Sharing (Shared __Canon code).
       Directly backed by runtime measurement from code/Advanced. -->
  <defs>
    <linearGradient id="bgWash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F3F0FC"/>
    </linearGradient>
    <filter id="ddShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dy="4" in="blur" result="off"/>
      <feComponentTransfer in="off" result="shadow"><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bgWash)"/>

  <!-- Category & Title -->
  <text x="80" y="70" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700" fill="#6E6E76" letter-spacing="3">RUNTIME / INTERNAL VIEW</text>
  <text x="80" y="115" font-family="Segoe UI, Inter, sans-serif" font-size="32" font-weight="700" fill="#1B1B1F">Specialization vs. Code Sharing (__Canon)</text>

  <!-- ========================================== -->
  <!-- PANEL 1: VALUE TYPE SPECIALIZATION (LEFT) -->
  <!-- ========================================== -->
  <g transform="translate(80, 160)">
    <rect width="680" height="640" rx="16" fill="#FFFFFF" stroke="#0078D4" stroke-width="2" filter="url(#ddShadow)"/>
    <rect width="680" height="50" rx="16" fill="#0078D4"/>
    <rect y="28" width="680" height="22" fill="#0078D4"/>
    <text x="340" y="32" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">VALUE TYPES: CODE SPECIALIZATION (PER STRUCT SIZE)</text>

    <!-- Sub-block 1: List<int> -->
    <g transform="translate(30, 80)">
      <rect width="620" height="150" rx="10" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5"/>
      <text x="24" y="35" font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700" fill="#0078D4">List&lt;int&gt; MethodTable (0x7FFA48310100)</text>
      <text x="24" y="65" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#334155">• Array elements: 4-byte packed integers in contiguous memory.</text>
      <text x="24" y="90" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#334155">• JIT emits specialized 32-bit registers (EAX, EDX).</text>
      <text x="24" y="120" font-family="Cascadia Code, Consolas, monospace" font-size="12" font-weight="700" fill="#0078D4">Native Code Address: 0x7FFA48313DE0</text>
    </g>

    <!-- Sub-block 2: List<double> -->
    <g transform="translate(30, 260)">
      <rect width="620" height="150" rx="10" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5"/>
      <text x="24" y="35" font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700" fill="#0078D4">List&lt;double&gt; MethodTable (0x7FFA48310240)</text>
      <text x="24" y="65" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#334155">• Array elements: 8-byte IEEE 754 floating point slots.</text>
      <text x="24" y="90" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#334155">• JIT emits 64-bit AVX/SSE floating point instructions (XMM0).</text>
      <text x="24" y="120" font-family="Cascadia Code, Consolas, monospace" font-size="12" font-weight="700" fill="#0078D4">Native Code Address: 0x7FFA48313E10  (DIFFERENT!)</text>
    </g>

    <!-- Takeaway Summary -->
    <g transform="translate(30, 440)">
      <rect width="620" height="150" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="24" y="35" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#0F172A">The Engineering Tradeoff</text>
      <text x="24" y="65" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#107C10">• Zero boxing, direct memory alignment, vectorized CPU throughput.</text>
      <text x="24" y="95" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#D83B01">• Tradeoff: Each distinct value type creates a unique JIT assembly body.</text>
      <text x="24" y="125" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" fill="#0078D4">Zero memory wasted on boxing or object headers!</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- PANEL 2: REFERENCE TYPE CODE SHARING (RIGHT) -->
  <!-- ========================================== -->
  <g transform="translate(840, 160)">
    <rect width="680" height="640" rx="16" fill="#FFFFFF" stroke="#512BD4" stroke-width="2" filter="url(#ddShadow)"/>
    <rect width="680" height="50" rx="16" fill="#512BD4"/>
    <rect y="28" width="680" height="22" fill="#512BD4"/>
    <text x="340" y="32" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">REFERENCE TYPES: CANONICAL CODE SHARING (__Canon)</text>

    <!-- Shared Canon Code Block -->
    <g transform="translate(30, 80)">
      <rect width="620" height="210" rx="12" fill="#FAF5FF" stroke="#C084FC" stroke-width="2"/>
      <text x="24" y="35" font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700" fill="#512BD4">CANONICAL CODE: List&lt;__Canon&gt;::Add(T item)</text>
      <text x="24" y="65" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#581C87">One single JIT-compiled assembly body shared by ALL class types!</text>
      
      <!-- Code lines -->
      <rect x="24" y="80" width="570" height="75" rx="6" fill="#1E1E2E"/>
      <text x="40" y="105" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#A5B4FC">0x7FFA48313E28:</text>
      <text x="40" y="125" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#38BDF8">mov  rax, [rcx + 8]   ; load 8-byte pointer slot</text>
      <text x="40" y="145" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#38BDF8">ret</text>

      <text x="24" y="185" font-family="Cascadia Code, Consolas, monospace" font-size="12" font-weight="700" fill="#512BD4">Shared Pointer: 0x7FFA48313E28</text>
    </g>

    <!-- Three Closed Reference Types Sharing It -->
    <g transform="translate(30, 315)">
      <!-- Box 1: string -->
      <rect x="0" y="0" width="190" height="95" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="95" y="30" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="700" fill="#512BD4" text-anchor="middle">List&lt;string&gt;</text>
      <text x="95" y="55" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#6E6E76" text-anchor="middle">8-byte ptr</text>
      <text x="95" y="75" font-family="Cascadia Code, Consolas, monospace" font-size="10" fill="#0078D4" text-anchor="middle">MT: 0x7FFA...10</text>

      <!-- Box 2: Customer -->
      <rect x="215" y="0" width="190" height="95" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="310" y="30" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="700" fill="#512BD4" text-anchor="middle">List&lt;Customer&gt;</text>
      <text x="310" y="55" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#6E6E76" text-anchor="middle">8-byte ptr</text>
      <text x="310" y="75" font-family="Cascadia Code, Consolas, monospace" font-size="10" fill="#0078D4" text-anchor="middle">MT: 0x7FFA...20</text>

      <!-- Box 3: Order -->
      <rect x="430" y="0" width="190" height="95" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="525" y="30" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="700" fill="#512BD4" text-anchor="middle">List&lt;Order&gt;</text>
      <text x="525" y="55" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#6E6E76" text-anchor="middle">8-byte ptr</text>
      <text x="525" y="75" font-family="Cascadia Code, Consolas, monospace" font-size="10" fill="#0078D4" text-anchor="middle">MT: 0x7FFA...30</text>
    </g>

    <!-- Takeaway Summary -->
    <g transform="translate(30, 440)">
      <rect width="620" height="150" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="24" y="35" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Why Code Sharing Matters</text>
      <text x="24" y="65" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#6E6E76">• Every reference type is a uniform 8-byte pointer on 64-bit platforms.</text>
      <text x="24" y="95" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#6E6E76">• Sharing canonical assembly eliminates binary code bloat in large apps.</text>
      <text x="24" y="125" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" fill="#512BD4">Each has a unique MethodTable, but shares identical JIT code!</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="800" y="855" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#9CA3AF" text-anchor="middle">
    Inside .NET — Understanding What Really Happens Under the Hood
  </text>
</svg>

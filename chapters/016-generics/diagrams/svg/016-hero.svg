<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgWash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F3F0FC"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feOffset dy="8" in="blur" result="offsetBlur"/>
      <feComponentTransfer in="offsetBlur" result="shadow">
        <feFuncA type="linear" slope="0.18"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#0078D4"/>
    </marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#512BD4"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bgWash)"/>

  <!-- Category & Title -->
  <text x="100" y="85" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="600" fill="#6E6E76" letter-spacing="3">PART III — C# · EPISODE 17</text>
  <text x="100" y="130" font-family="Segoe UI, Inter, sans-serif" font-size="36" font-weight="700" fill="#1B1B1F">Generics Under the Hood</text>
  <text x="100" y="165" font-family="Segoe UI, Inter, sans-serif" font-size="16" fill="#6E6E76">Reified types, value type specialization, reference type code sharing, and zero-overhead abstraction</text>

  <!-- Central Source: Open Generic Type List<T> -->
  <g filter="url(#softShadow)" transform="translate(680, 185)">
    <!-- Top Face -->
    <polygon points="120,40 200,0 280,40 200,80" fill="#F1F5F9"/>
    <!-- Left Face -->
    <polygon points="120,40 200,80 200,160 120,120" fill="#94A3B8"/>
    <!-- Right Face -->
    <polygon points="200,80 280,40 280,120 200,160" fill="#64748B"/>

    <text x="200" y="46" font-family="Cascadia Code, Consolas, monospace" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">List&lt;T&gt;</text>
  </g>
  <text x="880" y="375" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Open Generic Definition (JIT Template)</text>

  <!-- Branch 1: Left to Value Types -->
  <path d="M 760 310 C 600 360, 440 370, 360 435" fill="none" stroke="#0078D4" stroke-width="3" marker-end="url(#blueArrow)"/>
  <rect x="420" y="340" width="190" height="32" rx="16" fill="#EFF6FF" stroke="#0078D4" stroke-width="1.5"/>
  <text x="515" y="361" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" fill="#0078D4" text-anchor="middle">Value Types: T is struct</text>

  <!-- Left Card: Code Specialization -->
  <g filter="url(#softShadow)" transform="translate(100, 445)">
    <rect width="520" height="290" rx="16" fill="#FFFFFF" stroke="#0078D4" stroke-width="2"/>
    <rect width="520" height="46" rx="16" fill="#0078D4"/>
    <rect y="26" width="520" height="20" fill="#0078D4"/>
    <text x="260" y="30" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Code Specialization (Unique Native Assembly)</text>

    <!-- Sub-elements: 3 distinct cubes for int, double, struct -->
    <g transform="translate(30, 65)">
      <!-- int -->
      <polygon points="30,22 55,8 80,22 55,36" fill="#DBEAFE"/>
      <polygon points="30,22 55,36 55,62 30,48" fill="#60A5FA"/>
      <polygon points="55,36 80,22 80,48 55,62" fill="#0078D4"/>
      <text x="105" y="34" font-family="Cascadia Code, Consolas, monospace" font-size="14" font-weight="700" fill="#0F172A">List&lt;int&gt;</text>
      <text x="105" y="54" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#64748B">Dedicated 4-byte packed slots · Zero boxing</text>

      <!-- double -->
      <g transform="translate(0, 68)">
        <polygon points="30,22 55,8 80,22 55,36" fill="#DBEAFE"/>
        <polygon points="30,22 55,36 55,62 30,48" fill="#60A5FA"/>
        <polygon points="55,36 80,22 80,48 55,62" fill="#0078D4"/>
        <text x="105" y="34" font-family="Cascadia Code, Consolas, monospace" font-size="14" font-weight="700" fill="#0F172A">List&lt;double&gt;</text>
        <text x="105" y="54" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#64748B">Dedicated 8-byte slots · SIMD AVX/SSE optimized</text>
      </g>

      <!-- custom struct -->
      <g transform="translate(0, 136)">
        <polygon points="30,22 55,8 80,22 55,36" fill="#DBEAFE"/>
        <polygon points="30,22 55,36 55,62 30,48" fill="#60A5FA"/>
        <polygon points="55,36 80,22 80,48 55,62" fill="#0078D4"/>
        <text x="105" y="34" font-family="Cascadia Code, Consolas, monospace" font-size="14" font-weight="700" fill="#0F172A">List&lt;Point3D&gt;</text>
        <text x="105" y="54" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#64748B">Inlined struct layout · Maximum CPU cache locality</text>
      </g>
    </g>
  </g>

  <!-- Branch 2: Right to Reference Types -->
  <path d="M 1000 310 C 1160 360, 1320 370, 1400 435" fill="none" stroke="#512BD4" stroke-width="3" marker-end="url(#purpleArrow)"/>
  <rect x="1150" y="340" width="190" height="32" rx="16" fill="#F5F3FF" stroke="#512BD4" stroke-width="1.5"/>
  <text x="1245" y="361" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" fill="#512BD4" text-anchor="middle">Reference Types: T is class</text>

  <!-- Right Card: Canonical Code Sharing -->
  <g filter="url(#softShadow)" transform="translate(980, 445)">
    <rect width="520" height="290" rx="16" fill="#FFFFFF" stroke="#512BD4" stroke-width="2"/>
    <rect width="520" height="46" rx="16" fill="#512BD4"/>
    <rect y="26" width="520" height="20" fill="#512BD4"/>
    <text x="260" y="30" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Canonical Code Sharing (__Canon)</text>

    <g transform="translate(30, 65)">
      <!-- Shared Canon Box -->
      <rect x="10" y="10" width="440" height="65" rx="10" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
      <text x="30" y="38" font-family="Cascadia Code, Consolas, monospace" font-size="14" font-weight="700" fill="#512BD4">List&lt;__Canon&gt; Native Assembly Body</text>
      <text x="30" y="58" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#6D28D9">Shared JIT machine instructions for ALL reference types</text>

      <!-- Shared Types Fan-in -->
      <g transform="translate(10, 95)">
        <text x="15" y="25" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="600" fill="#0F172A">• List&lt;string&gt;</text>
        <text x="160" y="25" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="600" fill="#0F172A">• List&lt;Customer&gt;</text>
        <text x="315" y="25" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="600" fill="#0F172A">• List&lt;Order&gt;</text>

        <text x="15" y="65" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#64748B">All references are uniform 8-byte heap addresses on x64.</text>
        <text x="15" y="88" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" fill="#512BD4">Eliminates code bloat while preserving 100% runtime type safety!</text>
      </g>
    </g>
  </g>

  <!-- Bottom Legend -->
  <text x="800" y="815" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="600" fill="#64748B" text-anchor="middle">
    Reification · Zero Boxing · Value Type Specialization · Reference Canonical Sharing · Generic Math
  </text>
</svg>

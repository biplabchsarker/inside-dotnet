<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- CONCEPT OVERVIEW — chapters/016-generics.
       Light isometric style matching 008-concept.svg.
       Row 1: .NET Reification flow (Runtime type awareness & specialization).
       Row 2: Type Erasure contrast (Types erased to Object / casting). -->
  <defs>
    <linearGradient id="bgWash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F3F0FC"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dy="5" in="blur" result="off"/>
      <feComponentTransfer in="off" result="shadow"><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="conceptArrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#6E6E76"/>
    </marker>
    <marker id="blueArrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#0078D4"/>
    </marker>
    <marker id="redArrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bgWash)"/>

  <!-- Category & Title -->
  <text x="80" y="70" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700" fill="#6E6E76" letter-spacing="3">CONCEPT OVERVIEW</text>
  <text x="80" y="115" font-family="Segoe UI, Inter, sans-serif" font-size="32" font-weight="700" fill="#1B1B1F">Reification vs. Type Erasure</text>

  <!-- ========================================== -->
  <!-- ROW 1: .NET REIFICATION (TRUE RUNTIME TYPES) -->
  <!-- ========================================== -->
  <text x="80" y="195" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#0078D4" letter-spacing="2">1. .NET REIFICATION (FULL TYPE PRESERVATION AT RUNTIME)</text>

  <!-- Source Code -->
  <g filter="url(#softShadow)">
    <polygon points="170,230 215,250 170,270 125,250" fill="#BFDBFE"/>
    <polygon points="125,250 170,270 170,320 125,300" fill="#60A5FA"/>
    <polygon points="170,270 215,250 215,300 170,320" fill="#0078D4"/>
  </g>
  <text x="170" y="350" font-family="Cascadia Code, Consolas, monospace" font-size="14" font-weight="700" fill="#1B1B1F" text-anchor="middle">List&lt;int&gt;</text>
  <text x="170" y="372" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#6E6E76" text-anchor="middle">Source C#</text>

  <!-- Arrow to IL / Metadata -->
  <line x1="250" y1="275" x2="380" y2="275" stroke="#6E6E76" stroke-width="2.5" marker-end="url(#conceptArrow)"/>
  <rect x="270" y="245" width="90" height="30" rx="15" fill="#EFF6FF" stroke="#0078D4" stroke-width="1.5"/>
  <text x="315" y="265" font-family="Cascadia Code, Consolas, monospace" font-size="11" font-weight="700" fill="#0078D4" text-anchor="middle">TypeSpec</text>

  <!-- CLR Runtime Metadata -->
  <g filter="url(#softShadow)">
    <polygon points="490,220 550,250 490,280 430,250" fill="#DDD6FE"/>
    <polygon points="430,250 490,280 490,335 430,305" fill="#8B5CF6"/>
    <polygon points="490,280 550,250 550,305 490,335" fill="#512BD4"/>
  </g>
  <text x="490" y="360" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#2E1065" text-anchor="middle">CLR Runtime</text>
  <text x="490" y="382" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#6E6E76" text-anchor="middle">typeof(T) == Int32</text>

  <!-- Arrow to JIT Native Code -->
  <line x1="590" y1="275" x2="720" y2="275" stroke="#0078D4" stroke-width="2.5" marker-end="url(#blueArrow)"/>
  <rect x="610" y="245" width="95" height="30" rx="15" fill="#EFF6FF" stroke="#0078D4" stroke-width="1.5"/>
  <text x="657" y="265" font-family="Cascadia Code, Consolas, monospace" font-size="11" font-weight="700" fill="#0078D4" text-anchor="middle">RyuJIT</text>

  <!-- Specialized Native Code Block -->
  <g filter="url(#softShadow)">
    <polygon points="830,230 875,250 830,270 785,250" fill="#D1FAE5"/>
    <polygon points="785,250 830,270 830,320 785,300" fill="#34D399"/>
    <polygon points="830,270 875,250 875,300 830,320" fill="#107C10"/>
  </g>
  <text x="830" y="350" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#064E3B" text-anchor="middle">Native Machine Code</text>
  <text x="830" y="372" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#107C10" text-anchor="middle">4-byte packed slots · 0 Boxing</text>

  <!-- Explanatory Box -->
  <g transform="translate(980, 240)">
    <rect width="540" height="110" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="24" y="35" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#1B1B1F">Reified Types: Known to the Metal</text>
    <text x="24" y="65" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#6E6E76">• typeof(T), reflection, and type checks preserve real types at runtime.</text>
    <text x="24" y="90" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#6E6E76">• Value types get dedicated machine code tailored to their exact byte size.</text>
  </g>

  <!-- Divider Line -->
  <line x1="80" y1="440" x2="1520" y2="440" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- ========================================== -->
  <!-- ROW 2: TYPE ERASURE CONTRAST (JAVA MODEL) -->
  <!-- ========================================== -->
  <text x="80" y="500" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#DC2626" letter-spacing="2">2. TYPE ERASURE CONTRAST (JAVA MODEL: SYNTACTIC SUGAR ONLY)</text>

  <!-- Java Source Code -->
  <g filter="url(#softShadow)">
    <polygon points="170,540 215,560 170,580 125,560" fill="#FEE2E2"/>
    <polygon points="125,560 170,580 170,630 125,610" fill="#F87171"/>
    <polygon points="170,580 215,560 215,610 170,630" fill="#DC2626"/>
  </g>
  <text x="170" y="660" font-family="Cascadia Code, Consolas, monospace" font-size="14" font-weight="700" fill="#1B1B1F" text-anchor="middle">List&lt;Integer&gt;</text>
  <text x="170" y="682" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#6E6E76" text-anchor="middle">Source Java</text>

  <!-- Arrow to Bytecode -->
  <line x1="250" y1="585" x2="380" y2="585" stroke="#6E6E76" stroke-width="2.5" marker-end="url(#conceptArrow)"/>
  <rect x="270" y="555" width="90" height="30" rx="15" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="315" y="575" font-family="Cascadia Code, Consolas, monospace" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">javac</text>

  <!-- Erased JVM Runtime -->
  <g filter="url(#softShadow)">
    <polygon points="490,530 550,560 490,590 430,560" fill="#FEE2E2"/>
    <polygon points="430,560 490,590 490,645 430,615" fill="#F87171"/>
    <polygon points="490,590 550,560 550,615 490,645" fill="#DC2626"/>
  </g>
  <text x="490" y="670" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#991B1B" text-anchor="middle">JVM Runtime</text>
  <text x="490" y="692" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#DC2626" text-anchor="middle">Types ERASED to Object</text>

  <!-- Arrow to Casts -->
  <line x1="590" y1="585" x2="720" y2="585" stroke="#DC2626" stroke-width="2.5" marker-end="url(#redArrow)"/>
  <rect x="605" y="555" width="100" height="30" rx="15" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="655" y="575" font-family="Cascadia Code, Consolas, monospace" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">checkcast</text>

  <!-- Boxed Heap Objects -->
  <g filter="url(#softShadow)">
    <polygon points="830,540 875,560 830,580 785,560" fill="#FEF3C7"/>
    <polygon points="785,560 830,580 830,630 785,610" fill="#FBBF24"/>
    <polygon points="830,580 875,560 875,610 830,630" fill="#D97706"/>
  </g>
  <text x="830" y="660" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#92400E" text-anchor="middle">Boxed Objects</text>
  <text x="830" y="682" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#D97706" text-anchor="middle">Integer object heap pointer</text>

  <!-- Explanatory Box -->
  <g transform="translate(980, 540)">
    <rect width="540" height="120" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="24" y="35" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#1B1B1F">Type Erasure: Forgotten at Runtime</text>
    <text x="24" y="65" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#6E6E76">• JVM erases type parameters to Object during compilation.</text>
    <text x="24" y="90" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#6E6E76">• Cannot do new T(), primitive types must be boxed to heap wrappers.</text>
    <text x="24" y="112" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" fill="#DC2626">Massive cache miss penalty and heap allocation churn.</text>
  </g>

  <!-- Footer -->
  <text x="800" y="855" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#9CA3AF" text-anchor="middle">
    Inside .NET — Understanding What Really Happens Under the Hood
  </text>
</svg>

<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgWash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F3F0FC"/>
    </linearGradient>
    <filter id="ddShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dy="4" in="blur" result="off"/>
      <feComponentTransfer in="off" result="shadow"><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="redArrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#EF4444"/>
    </marker>
    <marker id="purpleArrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#512BD4"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bgWash)"/>

  <!-- Category & Title -->
  <text x="80" y="70" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700" fill="#6E6E76" letter-spacing="3">MEMORY / EXECUTION DIAGRAM</text>
  <text x="80" y="115" font-family="Segoe UI, Inter, sans-serif" font-size="32" font-weight="700" fill="#1B1B1F">Memory Hazards: Lapsed Listeners &amp; Closure Allocations</text>

  <!-- ========================================== -->
  <!-- ROW 1: THE LAPSED LISTENER MEMORY LEAK -->
  <!-- ========================================== -->
  <text x="80" y="190" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#EF4444" letter-spacing="2">1. THE LAPSED LISTENER TRAP (UNINTENDED STRONG REFERENCE CHAIN)</text>

  <!-- Static GC Root -->
  <g transform="translate(80, 220)" filter="url(#ddShadow)">
    <rect width="280" height="120" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="20" y="32" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#991B1B">GC ROOT (STATIC)</text>
    <text x="20" y="62" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="700" fill="#1B1B1F">AppHost.GlobalEvent</text>
    <text x="20" y="92" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#7F1D1D">Never collected by GC</text>
  </g>

  <!-- Strong Reference Arrow 1 -->
  <line x1="360" y1="280" x2="480" y2="280" stroke="#EF4444" stroke-width="2.5" marker-end="url(#redArrow)"/>
  <rect x="375" y="250" width="90" height="26" rx="13" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="420" y="268" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700" fill="#991B1B" text-anchor="middle">holds ref</text>

  <!-- MulticastDelegate Object -->
  <g transform="translate(490, 220)" filter="url(#ddShadow)">
    <rect width="320" height="120" rx="10" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1.5"/>
    <text x="20" y="32" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#9F1239">MULTICAST DELEGATE</text>
    <text x="20" y="62" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="700" fill="#BE123C">_target = 0x21F8...</text>
    <text x="20" y="92" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#E11D48">Strong reference to subscriber</text>
  </g>

  <!-- Strong Reference Arrow 2 -->
  <line x1="810" y1="280" x2="930" y2="280" stroke="#EF4444" stroke-width="2.5" marker-end="url(#redArrow)"/>
  <rect x="825" y="250" width="90" height="26" rx="13" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="870" y="268" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700" fill="#991B1B" text-anchor="middle">pins alive</text>

  <!-- Leaked Subscriber Object -->
  <g transform="translate(940, 210)" filter="url(#ddShadow)">
    <rect width="360" height="140" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="20" y="32" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#DC2626">LEAKED: UserProfileDialog</text>
    <text x="20" y="62" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#991B1B">Retains 25 MB UI graph</text>
    <text x="20" y="88" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#7F1D1D">User closed window hours ago, but</text>
    <text x="20" y="110" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" fill="#DC2626">GC sees it as reachable from Root!</text>
  </g>

  <!-- Solution Badge -->
  <g transform="translate(1330, 240)">
    <rect width="190" height="80" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
    <text x="95" y="32" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">HOW TO FIX</text>
    <text x="95" y="55" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#15803D" text-anchor="middle">Unsubscribe in Dispose</text>
    <text x="95" y="72" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#15803D" text-anchor="middle">or use WeakEventSource</text>
  </g>

  <!-- Divider Line -->
  <line x1="80" y1="440" x2="1520" y2="440" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- ========================================== -->
  <!-- ROW 2: CLOSURE ALLOCATION VS STATIC LAMBDAS -->
  <!-- ========================================== -->
  <text x="80" y="500" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#512BD4" letter-spacing="2">2. CLOSURE HEAP ALLOCATION VS. STATIC ZERO-ALLOCATION</text>

  <!-- Capturing Lambda (Allocating) -->
  <g transform="translate(80, 530)" filter="url(#ddShadow)">
    <rect width="420" height="200" rx="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/>
    <rect width="420" height="34" rx="12" fill="#FEE2E2"/>
    <rect y="20" width="420" height="14" fill="#FEE2E2"/>
    <text x="210" y="24" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#991B1B" text-anchor="middle">CAPTURING LAMBDA (ALLOCATES ON HEAP)</text>

    <text x="24" y="65" font-family="Cascadia Code, Consolas, monospace" font-size="13" fill="#1B1B1F">int factor = 42;</text>
    <text x="24" y="90" font-family="Cascadia Code, Consolas, monospace" font-size="13" fill="#EF4444">var fn = (x) =&gt; x * factor;</text>

    <text x="24" y="130" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#6E6E76">Roslyn hoists factor into compiler class:</text>
    <text x="24" y="152" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#581C87">new &lt;&gt;c__DisplayClass0_0()</text>
    <text x="24" y="180" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#EF4444">Allocates 32–48 bytes on Gen 0 per call!</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(520, 615)">
    <text x="100" y="-15" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">UPGRADE TO</text>
    <line x1="20" y1="5" x2="180" y2="5" stroke="#16A34A" stroke-width="3" marker-end="url(#purpleArrow)"/>
  </g>

  <!-- Static Lambda (Zero-Allocation) -->
  <g transform="translate(740, 530)" filter="url(#ddShadow)">
    <rect width="460" height="200" rx="12" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
    <rect width="460" height="34" rx="12" fill="#DCFCE7"/>
    <rect y="20" width="460" height="14" fill="#DCFCE7"/>
    <text x="230" y="24" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">STATIC ANONYMOUS FUNCTION (C# 9+)</text>

    <text x="24" y="65" font-family="Cascadia Code, Consolas, monospace" font-size="13" fill="#1B1B1F">// Compile error if you try to capture local state:</text>
    <text x="24" y="90" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="700" fill="#16A34A">var fn = static (int x) =&gt; x * 10;</text>

    <text x="24" y="130" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#6E6E76">Cached in static singleton field on startup</text>
    <text x="24" y="152" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#6E6E76">Zero display class allocated, zero GC overhead.</text>
    <text x="24" y="180" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#16A34A">Exactly 0 bytes allocated per call!</text>
  </g>

  <!-- Summary Card on Right -->
  <g transform="translate(1230, 530)" filter="url(#ddShadow)">
    <rect width="290" height="200" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="20" y="35" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#1B1B1F">The Golden Rule</text>
    <text x="20" y="65" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#64748B">Never capture loop variables or</text>
    <text x="20" y="85" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#64748B">this references in hot paths.</text>
    <text x="20" y="115" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#64748B">Always prefix non-capturing</text>
    <text x="20" y="135" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#16A34A" font-weight="700">lambdas with static to enforce</text>
    <text x="20" y="155" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#64748B">zero-allocation at compile time.</text>
  </g>

  <!-- Footer -->
  <text x="800" y="855" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#9CA3AF" text-anchor="middle">
    Inside .NET — Understanding What Really Happens Under the Hood
  </text>
</svg>

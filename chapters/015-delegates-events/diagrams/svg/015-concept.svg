<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgWash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F3F0FC"/>
    </linearGradient>
    <filter id="softShadow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dy="5" in="blur" result="off"/>
      <feComponentTransfer in="off" result="shadow"><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="conceptArrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#6E6E76"/>
    </marker>
    <marker id="purpleArrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#512BD4"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bgWash)"/>

  <!-- Category & Title -->
  <text x="80" y="70" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700" fill="#6E6E76" letter-spacing="3">CONCEPT OVERVIEW</text>
  <text x="80" y="115" font-family="Segoe UI, Inter, sans-serif" font-size="32" font-weight="700" fill="#1B1B1F">Delegates and Events — Core Architecture</text>

  <!-- ========================================== -->
  <!-- ROW 1: THE DELEGATE INVOCATION FLOW (SINGLE-CAST) -->
  <!-- ========================================== -->
  <text x="80" y="195" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#512BD4" letter-spacing="2">1. SINGLE-CAST DELEGATE INVOCATION</text>

  <!-- Caller (Stack) -->
  <g filter="url(#softShadow2)">
    <polygon points="170,230 215,250 170,270 125,250" fill="#BFDBFE"/>
    <polygon points="125,250 170,270 170,320 125,300" fill="#60A5FA"/>
    <polygon points="170,270 215,250 215,300 170,320" fill="#2D75C4"/>
  </g>
  <text x="170" y="350" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="700" fill="#1B1B1F" text-anchor="middle">Caller</text>
  <text x="170" y="372" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#6E6E76" text-anchor="middle">(Stack Frame)</text>

  <!-- Arrow to Delegate -->
  <line x1="250" y1="275" x2="380" y2="275" stroke="#6E6E76" stroke-width="2.5" marker-end="url(#conceptArrow)"/>
  <rect x="265" y="245" width="100" height="30" rx="15" fill="#EFF6FF" stroke="#0078D4" stroke-width="1.5"/>
  <text x="315" y="265" font-family="Cascadia Code, Consolas, monospace" font-size="12" font-weight="700" fill="#0078D4" text-anchor="middle">del(42)</text>

  <!-- Delegate Instance (Heap) -->
  <g filter="url(#softShadow2)">
    <polygon points="490,220 550,250 490,280 430,250" fill="#DDD6FE"/>
    <polygon points="430,250 490,280 490,335 430,305" fill="#8B5CF6"/>
    <polygon points="490,280 550,250 550,305 490,335" fill="#512BD4"/>
  </g>
  <text x="490" y="360" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="700" fill="#2E1065" text-anchor="middle">MulticastDelegate</text>
  <text x="490" y="382" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#6E6E76" text-anchor="middle">_target + _methodPtr</text>

  <!-- Arrow to Native Execution -->
  <line x1="590" y1="275" x2="720" y2="275" stroke="#512BD4" stroke-width="2.5" marker-end="url(#purpleArrow)"/>
  <rect x="605" y="245" width="105" height="30" rx="15" fill="#F3F0FC" stroke="#512BD4" stroke-width="1.5"/>
  <text x="657" y="265" font-family="Cascadia Code, Consolas, monospace" font-size="11" font-weight="700" fill="#512BD4" text-anchor="middle">call [_ptr]</text>

  <!-- Target Method & Receiver Object -->
  <g filter="url(#softShadow2)">
    <polygon points="830,230 875,250 830,270 785,250" fill="#D1FAE5"/>
    <polygon points="785,250 830,270 830,320 785,300" fill="#34D399"/>
    <polygon points="830,270 875,250 875,300 830,320" fill="#107C10"/>
  </g>
  <text x="830" y="350" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="700" fill="#064E3B" text-anchor="middle">Target Method</text>
  <text x="830" y="372" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#6E6E76" text-anchor="middle">Receiver Instance</text>

  <!-- Explanatory text on the right -->
  <g transform="translate(980, 230)">
    <rect width="540" height="120" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow2)"/>
    <text x="24" y="35" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="700" fill="#1B1B1F">Two-Pronged Managed Function Pointer</text>
    <text x="24" y="65" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#4B5563">• _target passes the instance reference in the RCX register.</text>
    <text x="24" y="90" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#4B5563">• _methodPtr is a raw native machine code address. Zero reflection.</text>
  </g>

  <!-- Divider Line -->
  <line x1="80" y1="440" x2="1520" y2="440" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- ========================================== -->
  <!-- ROW 2: THE EVENT PUBLISHER-SUBSCRIBER FLOW (MULTICAST) -->
  <!-- ========================================== -->
  <text x="80" y="500" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#0078D4" letter-spacing="2">2. EVENT PUBLISHER-SUBSCRIBER (MULTICAST CHAIN)</text>

  <!-- Publisher -->
  <g filter="url(#softShadow2)">
    <polygon points="170,540 215,560 170,580 125,560" fill="#DDD6FE"/>
    <polygon points="125,560 170,580 170,630 125,610" fill="#8B5CF6"/>
    <polygon points="170,580 215,560 215,610 170,630" fill="#512BD4"/>
  </g>
  <text x="170" y="660" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="700" fill="#1B1B1F" text-anchor="middle">Publisher</text>
  <text x="170" y="682" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#512BD4" text-anchor="middle">event Action</text>

  <!-- Arrow to Multicast Chain -->
  <line x1="250" y1="585" x2="380" y2="585" stroke="#6E6E76" stroke-width="2.5" marker-end="url(#conceptArrow)"/>
  <rect x="265" y="555" width="100" height="30" rx="15" fill="#EFF6FF" stroke="#0078D4" stroke-width="1.5"/>
  <text x="315" y="575" font-family="Cascadia Code, Consolas, monospace" font-size="12" font-weight="700" fill="#0078D4" text-anchor="middle">?.Invoke()</text>

  <!-- Multicast Chain Array [0, 1, 2] -->
  <g transform="translate(420, 520)">
    <rect width="180" height="150" rx="12" fill="#FFFFFF" stroke="#512BD4" stroke-width="2" filter="url(#softShadow2)"/>
    <rect width="180" height="32" rx="12" fill="#512BD4"/>
    <rect y="18" width="180" height="14" fill="#512BD4"/>
    <text x="90" y="22" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">_invocationList [3]</text>

    <text x="15" y="60" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#0078D4">[0] Logger.Write</text>
    <text x="15" y="95" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#107C10">[1] Audit.Record</text>
    <text x="15" y="130" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#D83B01">[2] UI.Refresh</text>
  </g>

  <!-- Connecting Lines to 3 Receivers -->
  <path d="M 610 575 L 720 535" stroke="#0078D4" stroke-width="2" marker-end="url(#conceptArrow)"/>
  <path d="M 610 595 L 720 595" stroke="#107C10" stroke-width="2" marker-end="url(#conceptArrow)"/>
  <path d="M 610 615 L 720 655" stroke="#D83B01" stroke-width="2" marker-end="url(#conceptArrow)"/>

  <!-- 3 Isometric Receivers -->
  <!-- Receiver 1 -->
  <g filter="url(#softShadow2)" transform="translate(730, 505)">
    <polygon points="35,15 55,25 35,35 15,25" fill="#BFDBFE"/>
    <polygon points="15,25 35,35 35,55 15,45" fill="#60A5FA"/>
    <polygon points="35,35 55,25 55,45 35,55" fill="#0078D4"/>
  </g>
  <text x="800" y="542" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#0078D4">Subscriber 1: Logger</text>

  <!-- Receiver 2 -->
  <g filter="url(#softShadow2)" transform="translate(730, 570)">
    <polygon points="35,15 55,25 35,35 15,25" fill="#D1FAE5"/>
    <polygon points="15,25 35,35 35,55 15,45" fill="#34D399"/>
    <polygon points="35,35 55,25 55,45 35,55" fill="#107C10"/>
  </g>
  <text x="800" y="607" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#107C10">Subscriber 2: Audit</text>

  <!-- Receiver 3 -->
  <g filter="url(#softShadow2)" transform="translate(730, 635)">
    <polygon points="35,15 55,25 35,35 15,25" fill="#FEE2E2"/>
    <polygon points="15,25 35,35 35,55 15,45" fill="#F87171"/>
    <polygon points="35,35 55,25 55,45 35,55" fill="#D83B01"/>
  </g>
  <text x="800" y="672" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#D83B01">Subscriber 3: UI</text>

  <!-- Explanatory text on the right -->
  <g transform="translate(980, 530)">
    <rect width="540" height="130" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow2)"/>
    <text x="24" y="35" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="700" fill="#1B1B1F">Decoupled Broadcasting with Sequential Loop</text>
    <text x="24" y="65" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#4B5563">• Publisher has ZERO concrete reference to Logger, Audit, or UI.</text>
    <text x="24" y="90" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#4B5563">• Listeners attach with += (calls thread-safe Delegate.Combine).</text>
    <text x="24" y="115" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" fill="#D83B01">Fault Hazard: If Subscriber 2 throws, Subscriber 3 never executes!</text>
  </g>

  <!-- Footer note -->
  <text x="800" y="860" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#9CA3AF" text-anchor="middle">
    Inside .NET — Understanding What Really Happens Under the Hood
  </text>
</svg>

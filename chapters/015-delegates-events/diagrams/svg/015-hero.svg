<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgWash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F3F0FC"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feOffset dy="10" in="blur" result="offsetBlur"/>
      <feComponentTransfer in="offsetBlur" result="shadow">
        <feFuncA type="linear" slope="0.18"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="heroArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#6366F1"/>
    </marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#0078D4"/>
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#107C10"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#D83B01"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bgWash)"/>

  <!-- Category & Title -->
  <text x="100" y="85" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="600" fill="#6E6E76" letter-spacing="3">PART III — C# · EPISODE 16</text>
  <text x="100" y="130" font-family="Segoe UI, Inter, sans-serif" font-size="36" font-weight="700" fill="#1B1B1F">Delegates &amp; Events Under the Hood</text>
  <text x="100" y="165" font-family="Segoe UI, Inter, sans-serif" font-size="16" fill="#6E6E76">Type-safe function pointers, multicast invocation chains, and event encapsulation in the CLR</text>

  <!-- ========================================== -->
  <!-- LEFT: CENTRAL MULTICAST DELEGATE CUBE      -->
  <!-- ========================================== -->
  <g filter="url(#softShadow)">
    <!-- Top Face -->
    <polygon points="400,280 520,215 640,280 520,345" fill="#DDD6FE"/>
    <!-- Left Face (_target) -->
    <polygon points="400,280 520,345 520,510 400,445" fill="#8B5CF6"/>
    <!-- Right Face (_methodPtr) -->
    <polygon points="520,345 640,280 640,445 520,510" fill="#512BD4"/>

    <!-- Labels on Cube -->
    <text x="520" y="270" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700" fill="#2E1065" text-anchor="middle">System.MulticastDelegate</text>
    <text x="520" y="295" font-family="Cascadia Code, Consolas, monospace" font-size="13" fill="#4338CA" text-anchor="middle">Managed Heap Object</text>

    <!-- Left Face Text -->
    <text x="460" y="415" font-family="Cascadia Code, Consolas, monospace" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">_target</text>
    <text x="460" y="440" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#EDE9FE" text-anchor="middle">Receiver Instance</text>

    <!-- Right Face Text -->
    <text x="580" y="415" font-family="Cascadia Code, Consolas, monospace" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">_methodPtr</text>
    <text x="580" y="440" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#EDE9FE" text-anchor="middle">Native Code Pointer</text>
  </g>

  <!-- Explanatory note below delegate -->
  <text x="520" y="555" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle">Single-Cast: Direct pointer dispatch</text>
  <text x="520" y="575" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Multicast: Traverses _invocationList array</text>

  <!-- ========================================== -->
  <!-- MIDDLE: DISPATCH FLOW                      -->
  <!-- ========================================== -->
  <line x1="660" y1="410" x2="780" y2="410" stroke="#6366F1" stroke-width="3.5" stroke-dasharray="8 6" marker-end="url(#heroArrow)"/>
  <rect x="665" y="365" width="130" height="30" rx="15" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="730" y="385" font-family="Cascadia Code, Consolas, monospace" font-size="12" font-weight="700" fill="#4338CA" text-anchor="middle">callvirt Invoke</text>

  <!-- Fanout branching lines -->
  <path d="M 800 410 C 860 410, 880 270, 950 270" fill="none" stroke="#0078D4" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#blueArrow)"/>
  <path d="M 800 410 L 950 410" fill="none" stroke="#107C10" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#greenArrow)"/>
  <path d="M 800 410 C 860 410, 880 550, 950 550" fill="none" stroke="#D83B01" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#redArrow)"/>

  <!-- ========================================== -->
  <!-- RIGHT: 3 ISOMETRIC SUBSCRIBERS             -->
  <!-- ========================================== -->

  <!-- Subscriber 1: Logger (Blue) -->
  <g filter="url(#softShadow)">
    <polygon points="980,245 1025,220 1070,245 1025,270" fill="#DBEAFE"/>
    <polygon points="980,245 1025,270 1025,320 980,295" fill="#60A5FA"/>
    <polygon points="1025,270 1070,245 1070,295 1025,320" fill="#0078D4"/>
  </g>
  <text x="1095" y="260" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700" fill="#0B3A66">Subscriber 1: Logger</text>
  <text x="1095" y="282" font-family="Cascadia Code, Consolas, monospace" font-size="13" fill="#0078D4">target.WriteLog(payload)</text>
  <text x="1095" y="302" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#6E6E76">Independent instance receiver</text>

  <!-- Subscriber 2: AuditService (Green) -->
  <g filter="url(#softShadow)">
    <polygon points="980,385 1025,360 1070,385 1025,410" fill="#D1FAE5"/>
    <polygon points="980,385 1025,410 1025,460 980,435" fill="#34D399"/>
    <polygon points="1025,410 1070,385 1070,435 1025,460" fill="#107C10"/>
  </g>
  <text x="1095" y="400" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700" fill="#064E3B">Subscriber 2: AuditService</text>
  <text x="1095" y="422" font-family="Cascadia Code, Consolas, monospace" font-size="13" fill="#107C10">target.RecordAudit(payload)</text>
  <text x="1095" y="442" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#6E6E76">Synchronous sequential execution</text>

  <!-- Subscriber 3: NotificationUI (Red/Orange) -->
  <g filter="url(#softShadow)">
    <polygon points="980,525 1025,500 1070,525 1025,550" fill="#FEE2E2"/>
    <polygon points="980,525 1025,550 1025,600 980,575" fill="#F87171"/>
    <polygon points="1025,550 1070,525 1070,575 1025,600" fill="#D83B01"/>
  </g>
  <text x="1095" y="540" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700" fill="#7F1D1D">Subscriber 3: NotificationUI</text>
  <text x="1095" y="562" font-family="Cascadia Code, Consolas, monospace" font-size="13" fill="#D83B01">target.RenderNotification(payload)</text>
  <text x="1095" y="582" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#6E6E76">Lapsed listener hazard if unsubscribed</text>

  <!-- ========================================== -->
  <!-- BOTTOM FEATURE BADGES                      -->
  <!-- ========================================== -->
  <g transform="translate(100, 750)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="325" height="52" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="24" y="32" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600" fill="#1E293B">Type-Safe Pointer Binding</text>

    <!-- Badge 2 -->
    <rect x="355" y="0" width="325" height="52" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="379" y="32" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600" fill="#1E293B">Interlocked Add / Remove Handlers</text>

    <!-- Badge 3 -->
    <rect x="710" y="0" width="325" height="52" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="734" y="32" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600" fill="#1E293B">Closures &amp; DisplayClass Allocations</text>

    <!-- Badge 4 -->
    <rect x="1065" y="0" width="325" height="52" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="1089" y="32" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600" fill="#1E293B">Lapsed Listener Hazard &amp; Weak Events</text>
  </g>
</svg>

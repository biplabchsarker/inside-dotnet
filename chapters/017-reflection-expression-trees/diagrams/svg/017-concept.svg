<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- CONCEPT OVERVIEW — chapters/017-reflection-expression-trees.
       Light isometric style matching 008-concept.svg.
       Row 1: Traditional Reflection (Metadata inspection & late binding).
       Row 2: Compiled Expression Trees (AST compilation & native execution). -->
  <defs>
    <linearGradient id="bgWash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F3F0FC"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dy="5" in="blur" result="off"/>
      <feComponentTransfer in="off" result="shadow"><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="conceptArrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#6E6E76"/>
    </marker>
    <marker id="redArrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#EF4444"/>
    </marker>
    <marker id="purpleArrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#512BD4"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bgWash)"/>

  <!-- Category & Title -->
  <text x="80" y="70" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700" fill="#6E6E76" letter-spacing="3">CONCEPT OVERVIEW</text>
  <text x="80" y="115" font-family="Segoe UI, Inter, sans-serif" font-size="32" font-weight="700" fill="#1B1B1F">The Metaprogramming Spectrum: Runtime Reflection vs. Compiled Expressions</text>

  <!-- ========================================== -->
  <!-- ROW 1: TRADITIONAL RUNTIME REFLECTION -->
  <!-- ========================================== -->
  <text x="80" y="195" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#DC2626" letter-spacing="2">1. TRADITIONAL REFLECTION (COLD PATH: INSPECTION &amp; LATE BINDING)</text>

  <!-- Caller -->
  <g filter="url(#softShadow)">
    <polygon points="170,230 215,250 170,270 125,250" fill="#FEE2E2"/>
    <polygon points="125,250 170,270 170,320 125,300" fill="#F87171"/>
    <polygon points="170,270 215,250 215,300 170,320" fill="#DC2626"/>
  </g>
  <text x="170" y="350" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#1B1B1F" text-anchor="middle">Caller</text>
  <text x="170" y="372" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#DC2626" text-anchor="middle">typeof(T)</text>

  <!-- Arrow to Metadata Table -->
  <line x1="250" y1="275" x2="380" y2="275" stroke="#6E6E76" stroke-width="2.5" marker-end="url(#conceptArrow)"/>
  <rect x="270" y="245" width="90" height="30" rx="15" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="315" y="265" font-family="Cascadia Code, Consolas, monospace" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">GetMethod</text>

  <!-- Metadata Token Tables -->
  <g filter="url(#softShadow)">
    <polygon points="490,220 550,250 490,280 430,250" fill="#FEF3C7"/>
    <polygon points="430,250 490,280 490,335 430,305" fill="#FBBF24"/>
    <polygon points="490,280 550,250 550,305 490,335" fill="#D97706"/>
  </g>
  <text x="490" y="360" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#92400E" text-anchor="middle">MethodInfo</text>
  <text x="490" y="382" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#6E6E76" text-anchor="middle">PE Metadata Token</text>

  <!-- Arrow to Invoke with Boxing -->
  <line x1="590" y1="275" x2="720" y2="275" stroke="#DC2626" stroke-width="2.5" marker-end="url(#redArrow)"/>
  <rect x="605" y="245" width="100" height="30" rx="15" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="655" y="265" font-family="Cascadia Code, Consolas, monospace" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">Invoke(obj[])</text>

  <!-- Late-Bound Target -->
  <g filter="url(#softShadow)">
    <polygon points="830,230 875,250 830,270 785,250" fill="#FEE2E2"/>
    <polygon points="785,250 830,270 830,320 785,300" fill="#F87171"/>
    <polygon points="830,270 875,250 875,300 830,320" fill="#DC2626"/>
  </g>
  <text x="830" y="350" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#7F1D1D" text-anchor="middle">Dynamic Invoke</text>
  <text x="830" y="372" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#DC2626" text-anchor="middle">~38–52 ns · 24–56 B alloc</text>

  <!-- Explanatory Box -->
  <g transform="translate(980, 240)">
    <rect width="540" height="110" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="24" y="35" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#1B1B1F">The Cost of Late Binding</text>
    <text x="24" y="65" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#6E6E76">• Performs runtime security checks and argument type validation.</text>
    <text x="24" y="90" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#6E6E76">• Requires an object[] array and boxes all primitive arguments.</text>
  </g>

  <!-- Divider Line -->
  <line x1="80" y1="440" x2="1520" y2="440" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- ========================================== -->
  <!-- ROW 2: COMPILED EXPRESSION TREES -->
  <!-- ========================================== -->
  <text x="80" y="500" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#512BD4" letter-spacing="2">2. COMPILED EXPRESSION TREES (HOT PATH: AST TO JIT COMPILATION)</text>

  <!-- Expression AST -->
  <g filter="url(#softShadow)">
    <polygon points="170,540 215,560 170,580 125,560" fill="#DDD6FE"/>
    <polygon points="125,560 170,580 170,630 125,610" fill="#8B5CF6"/>
    <polygon points="170,580 215,560 215,610 170,630" fill="#512BD4"/>
  </g>
  <text x="170" y="660" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#1B1B1F" text-anchor="middle">Expression AST</text>
  <text x="170" y="682" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#512BD4" text-anchor="middle">Expression&lt;Func&gt;</text>

  <!-- Arrow to Compile -->
  <line x1="250" y1="585" x2="380" y2="585" stroke="#6E6E76" stroke-width="2.5" marker-end="url(#conceptArrow)"/>
  <rect x="270" y="555" width="90" height="30" rx="15" fill="#F3F0FC" stroke="#512BD4" stroke-width="1.5"/>
  <text x="315" y="575" font-family="Cascadia Code, Consolas, monospace" font-size="11" font-weight="700" fill="#512BD4" text-anchor="middle">.Compile()</text>

  <!-- DynamicMethod Engine -->
  <g filter="url(#softShadow)">
    <polygon points="490,530 550,560 490,590 430,560" fill="#DBEAFE"/>
    <polygon points="430,560 490,590 490,645 430,615" fill="#60A5FA"/>
    <polygon points="490,590 550,560 550,615 490,645" fill="#0078D4"/>
  </g>
  <text x="490" y="670" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#0B3A66" text-anchor="middle">DynamicMethod</text>
  <text x="490" y="692" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#6E6E76" text-anchor="middle">CIL OpCodes Emitted</text>

  <!-- Arrow to Native Execution -->
  <line x1="590" y1="585" x2="720" y2="585" stroke="#512BD4" stroke-width="2.5" marker-end="url(#purpleArrow)"/>
  <rect x="610" y="555" width="90" height="30" rx="15" fill="#F3F0FC" stroke="#512BD4" stroke-width="1.5"/>
  <text x="655" y="575" font-family="Cascadia Code, Consolas, monospace" font-size="11" font-weight="700" fill="#512BD4" text-anchor="middle">RyuJIT</text>

  <!-- Compiled Delegate -->
  <g filter="url(#softShadow)">
    <polygon points="830,540 875,560 830,580 785,560" fill="#D1FAE5"/>
    <polygon points="785,560 830,580 830,630 785,610" fill="#34D399"/>
    <polygon points="830,580 875,560 875,610 830,630" fill="#107C10"/>
  </g>
  <text x="830" y="660" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#064E3B" text-anchor="middle">Compiled Delegate</text>
  <text x="830" y="682" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#107C10" text-anchor="middle">~1.2–1.3 ns · 0 B alloc</text>

  <!-- Explanatory Box -->
  <g transform="translate(980, 540)">
    <rect width="540" height="120" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="24" y="35" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#1B1B1F">Near-Native JIT Speed</text>
    <text x="24" y="65" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#6E6E76">• AST nodes are converted to raw CIL instructions once on compile.</text>
    <text x="24" y="90" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#6E6E76">• Generates a strongly typed delegate running at near-direct-call speed.</text>
    <text x="24" y="112" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" fill="#512BD4">Zero boxing, zero reflection arrays, zero security checks.</text>
  </g>

  <!-- Footer -->
  <text x="800" y="855" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#9CA3AF" text-anchor="middle">
    Inside .NET — Understanding What Really Happens Under the Hood
  </text>
</svg>

<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgWash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F3F0FC"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feOffset dy="8" in="blur" result="offsetBlur"/>
      <feComponentTransfer in="offsetBlur" result="shadow">
        <feFuncA type="linear" slope="0.16"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#DC2626"/>
    </marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#512BD4"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bgWash)"/>

  <!-- Category & Title -->
  <text x="100" y="85" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="600" fill="#6E6E76" letter-spacing="3">PART III — C# · EPISODE 18</text>
  <text x="100" y="130" font-family="Segoe UI, Inter, sans-serif" font-size="36" font-weight="700" fill="#1B1B1F">Reflection &amp; Expression Trees Under the Hood</text>
  <text x="100" y="165" font-family="Segoe UI, Inter, sans-serif" font-size="16" fill="#6E6E76">PE metadata tables, MethodInfo invocation overhead, dynamic IL emission, and compiled ASTs</text>

  <!-- Left: Central Source - Assembly Metadata Prism -->
  <g transform="translate(130, 280)">
    <g filter="url(#softShadow)">
      <!-- Top Face -->
      <polygon points="100,50 200,0 300,50 200,100" fill="#DDD6FE"/>
      <!-- Left Face -->
      <polygon points="100,50 200,100 200,200 100,150" fill="#8B5CF6"/>
      <!-- Right Face -->
      <polygon points="200,100 300,50 300,150 200,200" fill="#512BD4"/>
    </g>
    <text x="200" y="55" font-family="Cascadia Code, Consolas, monospace" font-size="16" font-weight="700" fill="#2E1065" text-anchor="middle">System.Type</text>
    <text x="150" y="135" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">PE Metadata</text>
    <text x="150" y="155" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#EDE9FE" text-anchor="middle">TypeDef / Tokens</text>
    <text x="250" y="135" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">MethodTable</text>
    <text x="250" y="155" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#EDE9FE" text-anchor="middle">EEClass &amp; Slots</text>
  </g>
  <text x="330" y="515" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">CLR Metadata &amp; Type Handles</text>

  <!-- Path 1: Top Branch to MethodInfo.Invoke -->
  <path d="M 440 340 C 530 300, 600 270, 710 270" fill="none" stroke="#DC2626" stroke-width="3" marker-end="url(#redArrow)"/>
  <rect x="495" y="275" width="165" height="30" rx="15" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="577" y="295" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" fill="#DC2626" text-anchor="middle">Cold Path · Late Binding</text>

  <!-- Path 2: Bottom Branch to Expression.Compile() -->
  <path d="M 440 430 C 530 460, 600 520, 710 520" fill="none" stroke="#512BD4" stroke-width="3" marker-end="url(#purpleArrow)"/>
  <rect x="495" y="465" width="165" height="30" rx="15" fill="#F5F3FF" stroke="#512BD4" stroke-width="1.5"/>
  <text x="577" y="485" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" fill="#512BD4" text-anchor="middle">Hot Path · AST to JIT</text>

  <!-- Top Right Card: MethodInfo.Invoke (Cold Path) -->
  <g transform="translate(730, 200)">
    <rect width="770" height="210" rx="16" fill="#FFFFFF" stroke="#DC2626" stroke-width="2" filter="url(#softShadow)"/>
    <rect width="770" height="42" rx="16" fill="#DC2626"/>
    <rect y="22" width="770" height="20" fill="#DC2626"/>
    <text x="24" y="27" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">1. Traditional Reflection: MethodInfo.Invoke(instance, args)</text>
    <text x="746" y="27" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#FEE2E2" text-anchor="end">~38–52 ns · 24–56 B GC churn</text>

    <!-- Content Columns -->
    <g transform="translate(24, 60)">
      <!-- Step A -->
      <rect x="0" y="0" width="225" height="125" rx="10" fill="#FEF2F2" stroke="#FECACA"/>
      <text x="16" y="26" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#991B1B">Token Metadata Lookup</text>
      <text x="16" y="50" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#7F1D1D">Inspects assembly tables,</text>
      <text x="16" y="70" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#7F1D1D">resolves method signatures,</text>
      <text x="16" y="90" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#7F1D1D">and validates accessibility.</text>
      <text x="16" y="112" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="600" fill="#DC2626">High metadata search cost</text>

      <!-- Step B -->
      <rect x="245" y="0" width="235" height="125" rx="10" fill="#FEF2F2" stroke="#FECACA"/>
      <text x="261" y="26" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#991B1B">Argument Marshalling</text>
      <text x="261" y="50" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#7F1D1D">Requires object[] array,</text>
      <text x="261" y="70" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#7F1D1D">boxes all value-type inputs,</text>
      <text x="261" y="90" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#7F1D1D">and verifies argument counts.</text>
      <text x="261" y="112" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="600" fill="#DC2626">Continuous Gen 0 churn</text>

      <!-- Step C -->
      <rect x="500" y="0" width="222" height="125" rx="10" fill="#FEF2F2" stroke="#FECACA"/>
      <text x="516" y="26" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#991B1B">Late Dispatch Bridge</text>
      <text x="516" y="50" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#7F1D1D">Unpacks parameters at call,</text>
      <text x="516" y="70" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#7F1D1D">invokes target MethodTable,</text>
      <text x="516" y="90" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#7F1D1D">and re-boxes return values.</text>
      <text x="516" y="112" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="600" fill="#DC2626">Cannot be JIT-inlined</text>
    </g>
  </g>

  <!-- Bottom Right Card: Expression.Compile() (Hot Path) -->
  <g transform="translate(730, 445)">
    <rect width="770" height="255" rx="16" fill="#FFFFFF" stroke="#512BD4" stroke-width="2" filter="url(#softShadow)"/>
    <rect width="770" height="42" rx="16" fill="#512BD4"/>
    <rect y="22" width="770" height="20" fill="#512BD4"/>
    <text x="24" y="27" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">2. Compiled Expression Trees: Expression&lt;Func&lt;T, R&gt;&gt;.Compile()</text>
    <text x="746" y="27" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#DDD6FE" text-anchor="end">~1.2–1.3 ns · 0 Bytes allocated!</text>

    <!-- Pipeline: AST -> DynamicMethod -> Native JIT -->
    <g transform="translate(24, 60)">
      <!-- Step 1: AST -->
      <rect x="0" y="0" width="225" height="170" rx="10" fill="#F5F3FF" stroke="#DDD6FE"/>
      <text x="16" y="26" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#4338CA">Abstract Syntax Tree</text>
      <text x="16" y="48" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#6B7280">Code structured as data:</text>
      <text x="16" y="70" font-family="Cascadia Code, Consolas, monospace" font-size="11" fill="#512BD4">• LambdaExpression</text>
      <text x="16" y="90" font-family="Cascadia Code, Consolas, monospace" font-size="11" fill="#512BD4">• BinaryExpression</text>
      <text x="16" y="110" font-family="Cascadia Code, Consolas, monospace" font-size="11" fill="#512BD4">• MemberExpression</text>
      <text x="16" y="132" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#6B7280">Inspectable &amp; rewritable</text>
      <text x="16" y="152" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="600" fill="#107C10">Zero runtime evaluation</text>

      <!-- Step 2: Emit -->
      <rect x="245" y="0" width="235" height="170" rx="10" fill="#F0F9FF" stroke="#BAE6FD"/>
      <text x="261" y="26" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#0369A1">DynamicMethod (IL)</text>
      <text x="261" y="48" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#6B7280">One-time CIL generation:</text>
      <text x="261" y="70" font-family="Cascadia Code, Consolas, monospace" font-size="11" fill="#0284C7">ldarg.0</text>
      <text x="261" y="90" font-family="Cascadia Code, Consolas, monospace" font-size="11" fill="#0284C7">callvirt Product::get_Price</text>
      <text x="261" y="110" font-family="Cascadia Code, Consolas, monospace" font-size="11" fill="#0284C7">ldc.i4.s 40</text>
      <text x="261" y="130" font-family="Cascadia Code, Consolas, monospace" font-size="11" fill="#0284C7">ret</text>
      <text x="261" y="152" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="600" fill="#0078D4">Cached once in static field</text>

      <!-- Step 3: Native Delegate -->
      <rect x="500" y="0" width="222" height="170" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
      <text x="516" y="26" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#065F46">RyuJIT Machine Code</text>
      <text x="516" y="48" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#6B7280">JIT produces native x64:</text>
      <text x="516" y="70" font-family="Cascadia Code, Consolas, monospace" font-size="11" fill="#059669">mov   rcx, [rcx + 8]</text>
      <text x="516" y="90" font-family="Cascadia Code, Consolas, monospace" font-size="11" fill="#059669">cmp   rcx, 40</text>
      <text x="516" y="110" font-family="Cascadia Code, Consolas, monospace" font-size="11" fill="#059669">setg  al; ret</text>
      <text x="516" y="132" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#047857">Arguments in CPU registers</text>
      <text x="516" y="152" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700" fill="#107C10">Direct pointer execution</text>
    </g>
  </g>

  <!-- Bottom Feature Badges -->
  <g transform="translate(100, 750)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="325" height="52" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="24" y="32" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600" fill="#1E293B">Metadata Tables &amp; PE Tokens</text>

    <!-- Badge 2 -->
    <rect x="355" y="0" width="325" height="52" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="379" y="32" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600" fill="#1E293B">Late-Binding &amp; Boxing Churn</text>

    <!-- Badge 3 -->
    <rect x="710" y="0" width="325" height="52" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="734" y="32" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600" fill="#1E293B">AST Decomposition &amp; Visitors</text>

    <!-- Badge 4 -->
    <rect x="1065" y="0" width="325" height="52" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="1089" y="32" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600" fill="#1E293B">DynamicMethod &amp; RyuJIT Emission</text>
  </g>

  <!-- Footer -->
  <text x="800" y="860" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#9CA3AF" text-anchor="middle">
    Inside .NET — Understanding What Really Happens Under the Hood
  </text>
</svg>

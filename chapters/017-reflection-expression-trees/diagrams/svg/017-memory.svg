<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- MEMORY / EXECUTION DIAGRAM — chapters/017-reflection-expression-trees.
       Clean two-row memory comparison matching 008-deepdive.svg standard.
       Row 1: Reflection memory churn (object[] arrays + primitive boxing on every call).
       Row 2: Compiled Expression Tree memory profile (Zero allocations on hot path). -->
  <defs>
    <linearGradient id="bgWash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F3F0FC"/>
    </linearGradient>
    <filter id="ddShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dy="4" in="blur" result="off"/>
      <feComponentTransfer in="off" result="shadow"><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bgWash)"/>

  <!-- Category & Title -->
  <text x="80" y="70" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700" fill="#6E6E76" letter-spacing="3">MEMORY / EXECUTION DIAGRAM</text>
  <text x="80" y="115" font-family="Segoe UI, Inter, sans-serif" font-size="32" font-weight="700" fill="#1B1B1F">Memory Footprint: Dynamic Heap vs. Reflection Churn</text>

  <!-- ========================================== -->
  <!-- ROW 1: REFLECTION HEAP CHURN -->
  <!-- ========================================== -->
  <text x="80" y="190" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#EF4444" letter-spacing="2">1. TRADITIONAL REFLECTION (REPEATED ALLOCATIONS ON EVERY CALL)</text>

  <g transform="translate(80, 220)">
    <rect width="1440" height="170" rx="14" fill="#FFFFFF" stroke="#F87171" stroke-width="1.5" filter="url(#ddShadow)"/>
    <rect width="1440" height="34" rx="14" fill="#FEE2E2"/>
    <rect y="20" width="1440" height="14" fill="#FEE2E2"/>
    <text x="720" y="24" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#991B1B" text-anchor="middle">MethodInfo.Invoke(instance, new object[] { 42m })</text>

    <!-- Visual of Allocations on Heap -->
    <g transform="translate(40, 55)">
      <!-- Box 1: object[] array -->
      <rect x="0" y="10" width="340" height="80" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
      <text x="20" y="38" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="700" fill="#991B1B">new object[1]</text>
      <text x="20" y="62" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#7F1D1D">Array allocation on Gen 0: 32 bytes</text>
      <text x="20" y="80" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#DC2626">Allocated on every single invocation</text>

      <!-- Plus sign -->
      <text x="375" y="55" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="700" fill="#6E6E76">+</text>

      <!-- Box 2: Boxed Primitive -->
      <rect x="420" y="10" width="340" height="80" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
      <text x="440" y="38" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="700" fill="#991B1B">Boxed Decimal / Int</text>
      <text x="440" y="62" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#7F1D1D">Heap Box allocation: 24–32 bytes</text>
      <text x="440" y="80" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#DC2626">Pruned only by subsequent GC collections</text>

      <!-- Equals sign -->
      <text x="795" y="55" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="700" fill="#6E6E76">=</text>

      <!-- Impact Summary Box -->
      <rect x="840" y="10" width="520" height="80" rx="8" fill="#FFF1F2" stroke="#FDA4AF"/>
      <text x="864" y="35" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#9F1239">GC Consequence: Continuous Gen 0 Spikes</text>
      <text x="864" y="58" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#BE123C">100,000 invocations allocate ~5.6 MB of transient garbage.</text>
      <text x="864" y="78" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" fill="#E11D48">Triggers frequent Gen 0 collections in web request pipelines!</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="80" y1="435" x2="1520" y2="435" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- ========================================== -->
  <!-- ROW 2: COMPILED EXPRESSION ZERO-ALLOCATION PROFILE -->
  <!-- ========================================== -->
  <text x="80" y="490" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#16A34A" letter-spacing="2">2. COMPILED EXPRESSION TREES (COMPILE ONCE, ZERO ALLOCATION ON HOT PATH)</text>

  <g transform="translate(80, 520)">
    <rect width="1440" height="230" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="2" filter="url(#ddShadow)"/>
    <rect width="1440" height="34" rx="14" fill="#DCFCE7"/>
    <rect y="20" width="1440" height="14" fill="#DCFCE7"/>
    <text x="720" y="24" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">compiledLambda.Invoke(instance, 42m)</text>

    <!-- Side-by-Side: Compile Time vs Execution Time -->
    <g transform="translate(40, 60)">
      <!-- Compile Phase (One-Time) -->
      <rect x="0" y="0" width="620" height="140" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="24" y="32" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Compile Phase (One-Time Cost on Startup)</text>
      <text x="24" y="60" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#64748B">• Generates DynamicMethod on the Dynamic Code Heap.</text>
      <text x="24" y="85" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#64748B">• Takes ~0.2–0.5 ms once per application lifecycle.</text>
      <text x="24" y="112" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" fill="#512BD4">Cached in a static field: MapperCache&lt;TSource, TTarget&gt;</text>

      <!-- Hot Path Invocations -->
      <rect x="680" y="0" width="680" height="140" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
      <text x="704" y="32" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="700" fill="#166534">Hot Path Execution (Millions of Calls)</text>
      <text x="704" y="60" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#15803D">Allocations per invocation: Exactly 0 Bytes!</text>
      <text x="704" y="85" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#166534">• Arguments passed in native CPU registers (RCX, RDX).</text>
      <text x="704" y="112" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#166534">• Zero GC pressure. 100,000 invocations run in under 4 milliseconds.</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="800" y="855" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#9CA3AF" text-anchor="middle">
    Inside .NET — Understanding What Really Happens Under the Hood
  </text>
</svg>

<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#512BD4"/>
      <stop offset="100%" stop-color="#0078D4"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#F8FAFC"/>
  
  <rect width="1600" height="100" fill="url(#headerGrad)"/>
  <text x="80" y="42" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" opacity="0.85" letter-spacing="2">INSIDE .NET — MEMORY &amp; EXECUTION TRACE</text>
  <text x="80" y="78" font-family="Segoe UI, Inter, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">Tracing the GC Root</text>

  <!-- Generational Heap Layout -->
  <rect x="150" y="200" width="1300" height="550" rx="16" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Gen 0 (Smallest, inside) -->
  <rect x="950" y="400" width="300" height="300" rx="12" fill="#E8F4FD" stroke="#107C10" stroke-width="2"/>
  <text x="1100" y="440" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="700" fill="#107C10" text-anchor="middle">Generation 0</text>
  <text x="1100" y="465" font-family="Segoe UI, Inter, sans-serif" font-size="14" fill="#107C10" text-anchor="middle">Objects *should* die here</text>

  <!-- Gen 1 -->
  <rect x="600" y="300" width="300" height="400" rx="12" fill="#FDF3EE" stroke="#D83B01" stroke-width="2"/>
  <text x="750" y="340" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="700" fill="#D83B01" text-anchor="middle">Generation 1</text>
  <text x="750" y="365" font-family="Segoe UI, Inter, sans-serif" font-size="14" fill="#D83B01" text-anchor="middle">Promotion path</text>

  <!-- Gen 2 (Largest) -->
  <rect x="250" y="250" width="300" height="450" rx="12" fill="#F5EEF8" stroke="#68217A" stroke-width="2"/>
  <text x="400" y="290" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="700" fill="#68217A" text-anchor="middle">Generation 2</text>
  <text x="400" y="315" font-family="Segoe UI, Inter, sans-serif" font-size="14" fill="#68217A" text-anchor="middle">Long-lived (Permanent Leaks)</text>

  <!-- Promotion Arrows -->
  <path d="M 950 550 L 900 550" fill="none" stroke="#D1D5DB" stroke-width="4" marker-end="url(#arrowGray)"/>
  <text x="925" y="535" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#6E6E76" text-anchor="middle">Promote</text>
  
  <path d="M 600 550 L 550 550" fill="none" stroke="#D1D5DB" stroke-width="4" marker-end="url(#arrowGray)"/>
  <text x="575" y="535" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#6E6E76" text-anchor="middle">Promote</text>

  <!-- The Leak Path -->
  <!-- 1. The Root -->
  <rect x="300" y="400" width="200" height="60" rx="6" fill="#68217A"/>
  <text x="400" y="425" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Static Event</text>
  <text x="400" y="445" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">(GC ROOT)</text>

  <!-- 2. Multicast Delegate (Gen 2) -->
  <rect x="300" y="550" width="200" height="60" rx="6" fill="#FFFFFF" stroke="#68217A" stroke-width="2"/>
  <text x="400" y="585" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#1B1B1F" text-anchor="middle">MulticastDelegate</text>

  <!-- Connection -->
  <path d="M 400 460 L 400 550" fill="none" stroke="#68217A" stroke-width="3" marker-end="url(#arrowPurple)"/>

  <!-- 3. Target Object (Leaked into Gen 2) -->
  <rect x="300" y="750" width="200" height="60" rx="6" fill="#D83B01"/>
  <text x="400" y="785" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">10MB Dashboard</text>

  <!-- Connection -->
  <path d="M 400 610 L 400 750" fill="none" stroke="#D83B01" stroke-width="4" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
  <text x="500" y="685" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700" fill="#D83B01" text-anchor="middle">Strong Ref to Target</text>

  <!-- Ghost of where it should be -->
  <rect x="1000" y="550" width="200" height="60" rx="6" fill="transparent" stroke="#107C10" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="1100" y="585" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#107C10" text-anchor="middle">10MB Dashboard</text>
  <text x="1100" y="630" font-family="Segoe UI, Inter, sans-serif" font-size="14" fill="#107C10" text-anchor="middle">Should have died here</text>

  <path d="M 1100 540 C 1100 400, 500 400, 500 780" fill="none" stroke="#D83B01" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="800" y="470" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700" fill="#D83B01" text-anchor="middle">Promoted and Leaked to Gen 2</text>


  <defs>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D1D5DB" />
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#68217A" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D83B01" />
    </marker>
  </defs>

</svg>

<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#512BD4"/>
      <stop offset="100%" stop-color="#0078D4"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#F8FAFC"/>
  
  <rect width="1600" height="100" fill="url(#headerGrad)"/>
  <text x="80" y="42" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" opacity="0.85" letter-spacing="2">INSIDE .NET — RUNTIME / INTERNAL VIEW</text>
  <text x="80" y="78" font-family="Segoe UI, Inter, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">Inside the MulticastDelegate</text>

  <!-- Publisher Code -->
  <text x="200" y="200" font-family="Cascadia Code, Fira Code, monospace" font-size="24" fill="#1B1B1F">publisher.Event </text>
  <text x="450" y="200" font-family="Cascadia Code, Fira Code, monospace" font-size="24" fill="#D83B01" font-weight="700">+= </text>
  <text x="500" y="200" font-family="Cascadia Code, Fira Code, monospace" font-size="24" fill="#107C10">subscriber.HandleEvent;</text>
  
  <!-- Down Arrow -->
  <path d="M 460 230 L 460 300" fill="none" stroke="#D1D5DB" stroke-width="4" marker-end="url(#arrowGray)"/>
  
  <text x="490" y="270" font-family="Segoe UI, Inter, sans-serif" font-size="16" fill="#6E6E76">Compiler translates to:</text>

  <!-- Publisher Box -->
  <rect x="200" y="320" width="300" height="150" rx="12" fill="#E8F4FD" stroke="#0078D4" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="360" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="700" fill="#0078D4" text-anchor="middle">Publisher Object</text>
  <rect x="220" y="390" width="260" height="60" rx="6" fill="#FFFFFF" stroke="#0078D4" stroke-width="2"/>
  <text x="350" y="425" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700" fill="#1B1B1F" text-anchor="middle">_invocationList (Field)</text>

  <!-- Delegate Arrow -->
  <path d="M 480 420 L 700 420" fill="none" stroke="#0078D4" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <!-- Delegate Box -->
  <rect x="750" y="300" width="300" height="240" rx="12" fill="#F5EEF8" stroke="#68217A" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="340" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="700" fill="#68217A" text-anchor="middle">MulticastDelegate</text>
  
  <rect x="780" y="380" width="240" height="60" rx="6" fill="#FFFFFF" stroke="#68217A" stroke-width="2"/>
  <text x="900" y="415" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700" fill="#1B1B1F" text-anchor="middle">Method (IntPtr)</text>
  
  <rect x="780" y="460" width="240" height="60" rx="6" fill="#FFFFFF" stroke="#D83B01" stroke-width="2"/>
  <text x="900" y="495" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700" fill="#D83B01" text-anchor="middle">Target (object reference)</text>

  <!-- Pointer to Method -->
  <path d="M 1020 410 L 1200 360" fill="none" stroke="#68217A" stroke-width="4" stroke-dasharray="6 4" marker-end="url(#arrowPurple)"/>
  
  <rect x="1250" y="310" width="250" height="80" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <text x="1375" y="345" font-family="Cascadia Code, Fira Code, monospace" font-size="16" font-weight="700" fill="#1B1B1F" text-anchor="middle">HandleEvent()</text>
  <text x="1375" y="365" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#6E6E76" text-anchor="middle">Method Table Pointer</text>

  <!-- Pointer to Target -->
  <path d="M 1020 490 L 1200 540" fill="none" stroke="#D83B01" stroke-width="6" marker-end="url(#arrowRed)"/>

  <!-- Subscriber Box -->
  <rect x="1250" y="480" width="250" height="150" rx="12" fill="#FDF3EE" stroke="#D83B01" stroke-width="2" filter="url(#shadow)"/>
  <text x="1375" y="520" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="700" fill="#D83B01" text-anchor="middle">Subscriber Object</text>
  <text x="1375" y="550" font-family="Segoe UI, Inter, sans-serif" font-size="14" fill="#D83B01" text-anchor="middle">10 MB UI Component</text>
  
  <rect x="1275" y="580" width="200" height="30" rx="4" fill="#FFFFFF" stroke="#D83B01" stroke-width="1"/>
  <text x="1375" y="600" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" fill="#1B1B1F" text-anchor="middle">10MB Array payload</text>

  <!-- Summary Box -->
  <rect x="200" y="650" width="1200" height="100" rx="8" fill="#F8FAFC" stroke="#D83B01" stroke-width="2"/>
  <text x="800" y="695" font-family="Segoe UI, Inter, sans-serif" font-size="18" font-weight="700" fill="#1B1B1F" text-anchor="middle">Because C# delegates track both the method AND the target instance, every `+=` creates a hidden strong reference.</text>
  <text x="800" y="725" font-family="Segoe UI, Inter, sans-serif" font-size="16" fill="#6E6E76" text-anchor="middle">The Subscriber cannot be garbage collected until the Publisher dies or `-=` is called.</text>

  <defs>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D1D5DB" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0078D4" />
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#68217A" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D83B01" />
    </marker>
  </defs>
</svg>
